name: pocket-id
services:
  pocket-id:
    command: null
    container_name: pocket-id
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
        reservations:
          memory: 128M
          cpus: "0.10"
      placement: {}
    entrypoint: null
    environment:
      APP_URL: CHANGEME_YOUR_SERVER_URL
      ENCRYPTION_KEY: re5nBm+ya8Q1Rgsjn6dY+l+2v/KyM4T7je14nYXMqvY=
      TRUST_PROXY: "false"
      MAXMIND_LICENSE_KEY: ""
      PGID: "1000"
      PUID: "1000"
      UI_CONFIG_DISABLED: "true"
      ALLOW_USER_SIGNUPS: disabled
      ANALYTICS_DISABLED: "false"
      VERSION_CHECK_DISABLED: "false"
    healthcheck:
      test:
        - CMD
        - /app/pocket-id
        - healthcheck
      timeout: 5s
      interval: 1m30s
      retries: 2
      start_period: 10s
    image: ghcr.io/pocket-id/pocket-id:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/icon.png
    network_mode: bridge
    ports:
      - target: 1411
        published: "8436"
        protocol: tcp
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - type: bind
        source: /DATA/AppData/pocket-id
        target: /app/data
        bind:
          create_host_path: true
    x-casaos:
      id: com.hiraappstore.pocketid
      envs:
        - container: APP_URL
          description:
            en_US: The exact address you will open Pocket ID at, like https://your-server-ip:8436.
              Passkeys are locked to this address — do not change it after setup.
        - container: ENCRYPTION_KEY
          description:
            en_US: Pre-filled with a random value. Replace it with your own — generate
              one at randomkeygen.com — before going live. Only change this right
              after a fresh install; changing it later makes existing encrypted
              data unreadable.
        - container: TRUST_PROXY
          description:
            en_US: Set to true, or to a comma-separated list of proxy IPs/CIDR ranges,
              if Pocket ID sits behind a reverse proxy. Leave as false otherwise.
        - container: MAXMIND_LICENSE_KEY
          description:
            en_US: Optional. A free MaxMind GeoLite2 license key used to show real
              locations in the audit log instead of "unknown".
        - container: PUID
          description:
            en_US: The user ID that should own the files under /app/data on the host.
        - container: PGID
          description:
            en_US: The group ID that should own the files under /app/data on the host.
        - container: UI_CONFIG_DISABLED
          description:
            en_US: Must be true for ALLOW_USER_SIGNUPS and other UI-configurable
              settings below to be controlled by environment variables instead of
              the in-app Settings page.
        - container: ALLOW_USER_SIGNUPS
          description:
            en_US: Controls self-service signup. Valid values are disabled, withToken,
              or open. Only takes effect when UI_CONFIG_DISABLED is true.
        - container: ANALYTICS_DISABLED
          description:
            en_US: Set to true to stop the daily anonymous heartbeat Pocket ID sends
              to count running instances.
        - container: VERSION_CHECK_DISABLED
          description:
            en_US: Set to true to stop Pocket ID from checking GitHub for newer
              versions.
      ports:
        - container: "1411"
          description:
            en_US: Pocket ID web UI and API (published on host as 8436)
      volumes:
        - container: /app/data
          description:
            en_US: Database, uploaded files, and signing keys
x-casaos:
  architectures:
    - amd64
    - arm64
  author: HSinghHira
  category: Networking
  developer: Pocket ID
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/thumbnail.webp
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/thumbnail.webp
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/thumbnail-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/thumbnail-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/PocketID/thumbnail-3.png
  description:
    en_US: >-
      Pocket ID is a simple, OpenID Connect Certified OIDC and OAuth 2.0
      provider built entirely around passkeys - no passwords, no accounts to
      leak, just sign in with a passkey or a hardware key like a YubiKey.


      **Features**


      - Passkey-only authentication - no passwords exist anywhere in the
        system.

      - OpenID Connect Certified and OAuth 2.0 compliant, so it works with
        most apps that support "Login with OIDC".

      - Simple admin UI for managing users, groups, and OIDC clients,
        without the complexity of Keycloak or ORY Hydra.

      - Optional self-service user signups, LDAP sync, and SCIM
        provisioning for pulling in users from an existing directory.

      - SQLite by default, with no separate database container needed.
        Persistent storage under /DATA/AppData/pocket-id.


      **How to use?**

      1. Open Pocket ID from the Zima OS dashboard.

      2. Go to /setup and create the first administrator account with a
         passkey.

      3. Add your other users, or connect LDAP if you already have a
         directory.

      4. Create an OIDC client for each self-hosted app you want to add
         single sign-on to.

      5. Point that app's OIDC settings at your Pocket ID issuer URL, and
         copy over the client ID and secret.

      6. Further settings, like custom branding, email, and self-service
         signups, live in the in-app admin panel under Settings, or can be
         locked to the environment variables below by setting
         UI_CONFIG_DISABLED to true.
  docs: https://pocket-id.org/docs/introduction
  hostname: ""
  id: com.hiraappstore.pocketid
  index: /
  is_uncontrolled: false
  main: pocket-id
  port_map: "8436"
  release_notes:
    en_US: |-
      - Added the missing top-level `name` field so Pocket ID's data now
        stores under /DATA/AppData/pocket-id instead of an
        auto-generated compose-<hash> folder.

      - Added UI_CONFIG_DISABLED, ALLOW_USER_SIGNUPS, ANALYTICS_DISABLED,
        and VERSION_CHECK_DISABLED environment variables.

      - Switched APP_URL's placeholder to the standard CHANGEME_* format.

      - Added the per-service x-casaos envs/ports/volumes metadata.
  repo: https://github.com/pocket-id/pocket-id
  scheme: http
  store_app_id: pocket-id
  support: https://github.com/pocket-id/pocket-id/issues
  tagline:
    en_US: A simple, passkey-only OIDC and OAuth 2.0 provider for your self-hosted
      apps.
  tips:
    before_install:
      en_US: |-
        1. Open the app configuration before starting the installation.

        2. Find APP_URL in the pocket-id service. It says
           CHANGEME_YOUR_SERVER_URL.

        3. Set it to the exact address you will open Pocket ID at, like
           https://your-server-ip:8436. Must be a secure IP/URL.

        4. Do not change APP_URL later. Passkeys are locked to this exact
           address, and changing it can break sign in.

        5. Find ENCRYPTION_KEY. It is pre-filled with a random value.

        6. Replace it with your own. Generate one at randomkeygen.com.

        7. Only change ENCRYPTION_KEY right after this fresh install,
           before adding real users.

        8. Want open or invite-only signups instead of admin-only? Set
           ALLOW_USER_SIGNUPS to open or withToken, and make sure
           UI_CONFIG_DISABLED stays set to true.

        9. Start the Pocket ID installation.

        10. Open Pocket ID from the Zima OS dashboard.

        11. Go to the /setup page and create your admin account with a
            passkey.

        12. More settings, like LDAP sync and email, are in the in-app
            admin panel under Settings.
  title:
    custom: Pocket ID
    en_US: Pocket ID
  update_at: 2026-09-09T00:00:00Z
  version: 2.14.0