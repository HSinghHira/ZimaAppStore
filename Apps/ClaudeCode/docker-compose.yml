name: ClaudeCode

services:
  ClaudeCode:
    image: ghcr.io/worph/claude-code-container:1.0.26
    container_name: ClaudeCode
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: bridge
    environment:
      - ANTHROPIC_API_KEY=CHANGEME_ANTHROPIC_API_KEY
      - AUTH_PASSWORD=ce35cd716f0376b5c7dfdd0f928e3633baaa68b8618b44f4
      - MCP_ENABLED=false
      - CLAUDE_SESSION_TTL=1800
    ports:
      - target: 8080
        published: "8443"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ClaudeCode/workspace
        target: /home/claude/workspace
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/ClaudeCode/config
        target: /home/claude/.claude
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/ClaudeCode/config/.claude.json
        target: /home/claude/.claude.json
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/ClaudeCode/icon.png
    x-casaos:
      id: com.hiraappstore.claudecode
      envs:
        - container: ANTHROPIC_API_KEY
          description:
            en_US: Your Anthropic API key. Leave the placeholder in place to
              sign in with a Claude Pro or Max subscription instead — a
              one-time login link will appear the first time you open the
              web terminal.
        - container: AUTH_PASSWORD
          description:
            en_US: Pre-filled with a random value. This is the password for
              the web terminal login page and also the Bearer token for the
              MCP API. Replace it with your own — generate one at
              randomkeygen.com — before relying on this app for anything
              sensitive.
        - container: MCP_ENABLED
          description:
            en_US: Keep this set to false unless you specifically need the
              /mcp automation endpoint for another Claude instance to call
              into this container. Turning it on also starts a UDP
              auto-discovery beacon that broadcasts AUTH_PASSWORD to other
              containers on the same Docker network.
        - container: CLAUDE_SESSION_TTL
          description:
            en_US: Seconds of inactivity before the shared web-terminal
              session is closed and the next visit starts fresh. Default is
              1800 (30 minutes).
      ports:
        - container: "8080"
          description:
            en_US: Web terminal (ttyd) running Claude Code, published on
              host as 8443.
      volumes:
        - container: /home/claude/workspace
          description:
            en_US: Your project files. Everything Claude Code reads and
              writes lives here.
        - container: /home/claude/.claude
          description:
            en_US: Claude Code's settings, login state, and conversation
              history.
        - container: /home/claude/.claude.json
          description:
            en_US: Claude Code's session-state file. Required alongside the
              .claude folder for login to survive a container restart.

x-casaos:
  id: com.hiraappstore.claudecode
  architectures:
    - amd64
    - arm64
  main: claudecode
  author: HSinghHira
  category: Developer
  developer: worph
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/ClaudeCode/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/ClaudeCode/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/ClaudeCode/thumbnail.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/ClaudeCode/thumbnail-1.png
  title:
    en_US: Claude Code Container
  tagline:
    en_US: A browser-based terminal for Anthropic's Claude Code CLI, with an optional API for programmatic access.
  description:
    en_US: >-
      Run Claude Code — Anthropic's AI coding CLI — in a persistent,
      browser-based terminal. Think of it as a coding assistant you can
      reach from any device, always sitting in the same workspace where you
      left it.


      **Features**


      - Web-based terminal to Claude Code via ttyd, with a login page

      - Session persists across browser tabs and reconnects via dtach, so
        closing the tab doesn't kill your Claude session

      - Optional MCP JSON-RPC API for other Claude/automation instances to
        send it prompts (off by default — see the MCP_ENABLED variable)

      - Optional OpenAI-compatible /v1/chat/completions endpoint that reuses
        the same login

      - Persistent storage for your project files and for Claude's login
        state and history under /DATA/AppData/$AppID

      - Multi-architecture image (amd64 and arm64)


      **How to use?**


      1. Open Claude Code Container from the Zima OS dashboard.

      2. You'll land on the login page — enter the AUTH_PASSWORD value from
         the app's environment settings.

      3. You're now in a live terminal running the `claude` CLI in
         /home/claude/workspace.

      4. If you left ANTHROPIC_API_KEY blank, follow the one-time OAuth link
         Claude Code prints to sign in with your Pro/Max subscription
         instead.

      5. Work normally — closing the tab won't end your session; reopening
         the app reattaches you to the same one until it times out after
         CLAUDE_SESSION_TTL seconds of inactivity.

      6. To let another automation client send it prompts over the network,
         set MCP_ENABLED to true and see the project's MCP docs — understand
         the trade-off noted on that variable first.
  tips:
    before_install:
      en_US: >-
        1. Open the app's environment settings before you start the
           install.


        2. Find ANTHROPIC_API_KEY. If you have an Anthropic API key, put it
           there. If not, leave it as is and you'll sign in with your
           Claude subscription later.


        3. Find AUTH_PASSWORD. It already has a random password filled in.


        4. Replace it with your own password — you can make one up, or
           generate one at randomkeygen.com. This password logs you into
           the web terminal and also works as the API key for the MCP
           feature.


        5. Leave MCP_ENABLED set to false unless you plan to connect
           another automation tool to this container. Turning it on also
           tells other containers on the network your AUTH_PASSWORD.


        6. Start the Claude Code Container installation.


        7. Open Claude Code Container from the Zima OS dashboard.


        8. Log in with the AUTH_PASSWORD you set.


        9. Your files live in the workspace folder shown in the app's
           storage settings. Back that up like any other project folder.


        10. Important: this app's own login page only works if you put a
            proxy that checks it in front of the app. Without one, treat
            the app's address as trusted-network-only, the same as any
            terminal you wouldn't want a stranger to stumble onto.
  index: /
  port_map: "8443"
  scheme: http
  is_uncontrolled: false
  version: "1.0.26"
  update_at: "2026-09-06"
  release_notes:
    en_US: |-
      - Initial version, pinned to ghcr.io/worph/claude-code-container:1.0.26.
      - MCP automation endpoint (/mcp) is disabled by default (MCP_ENABLED=false); the login page still runs. Enabling it also starts a UDP auto-discovery beacon that hands AUTH_PASSWORD to any container on the same Docker network.
      - Only the web-terminal port (8080, published as 8443) is exposed. The container's login page needs an external forward-auth-capable proxy in front of it to actually block unauthenticated visitors; none is bundled here, so treat the published port as trusted-network-only until you add one.
  repo: "https://github.com/worph/claude-code-container"
  support: "https://github.com/worph/claude-code-container/issues"
  docs: "https://github.com/worph/claude-code-container/tree/main/docs"
