name: documenso

networks:
  documenso_network:
    driver: bridge

services:
  documenso:
    image: documenso/documenso:latest
    container_name: documenso
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
    environment:
      - NEXTAUTH_SECRET=DwN9439C3sIE5xsxD1PrL8I9w9ptnDFCcW2riF8Qtv8=
      - NEXT_PRIVATE_ENCRYPTION_KEY=64MTHTfNU3k/ezJpNcTA+/oy4PJfRrnfXpaKz/cPyvY=
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=GHNkJzEuoOtDwbhL2QHAjhU4K9w9o9Ggs7YOVEUGRs4=
      - NEXT_PUBLIC_WEBAPP_URL=http://localhost:8446
      - NEXT_PRIVATE_INTERNAL_WEBAPP_URL=http://localhost:3000
      - NEXT_PRIVATE_DATABASE_URL=postgresql://documenso:2ac7833ce01076c3da8ea747fa8c8100@database:5432/documenso
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgresql://documenso:2ac7833ce01076c3da8ea747fa8c8100@database:5432/documenso
      - NEXT_PRIVATE_SMTP_TRANSPORT=smtp-auth
      - NEXT_PRIVATE_SMTP_HOST=CHANGEME_SMTP_HOST
      - NEXT_PRIVATE_SMTP_PORT=587
      - NEXT_PRIVATE_SMTP_USERNAME=CHANGEME_SMTP_USERNAME
      - NEXT_PRIVATE_SMTP_PASSWORD=CHANGEME_SMTP_PASSWORD
      - NEXT_PRIVATE_SMTP_FROM_NAME=Documenso
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=CHANGEME_SMTP_FROM_ADDRESS
      - NEXT_PRIVATE_SIGNING_PASSPHRASE=CHANGEME_SIGNING_PASSPHRASE
      - NEXT_PRIVATE_GOOGLE_CLIENT_ID=
      - NEXT_PRIVATE_GOOGLE_CLIENT_SECRET=
      - NEXT_PRIVATE_MICROSOFT_CLIENT_ID=
      - NEXT_PRIVATE_MICROSOFT_CLIENT_SECRET=
      - NEXT_PRIVATE_OIDC_WELL_KNOWN=
      - NEXT_PRIVATE_OIDC_CLIENT_ID=
      - NEXT_PRIVATE_OIDC_CLIENT_SECRET=
      - NEXT_PRIVATE_OIDC_PROVIDER_LABEL=OIDC
    networks:
      - documenso_network
    ports:
      - target: 3000
        published: "8446"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/cert.p12
        target: /opt/documenso/cert.p12
        read_only: true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Documenso/icon.png
    x-casaos:
      id: com.hiraappstore.documenso
      envs:
        - container: NEXTAUTH_SECRET
          description:
            en_US: >-
              Pre-filled with a random value used to sign login sessions.
              Replace it with your own — generate one at randomkeygen.com —
              before going live.
        - container: NEXT_PRIVATE_ENCRYPTION_KEY
          description:
            en_US: >-
              Pre-filled with a random value used to encrypt private data.
              Replace it with your own — generate one at randomkeygen.com —
              before going live.
        - container: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
          description:
            en_US: >-
              Pre-filled with a random backup encryption value. Replace it
              with your own — generate one at randomkeygen.com — before
              going live.
        - container: NEXT_PUBLIC_WEBAPP_URL
          description:
            en_US: >-
              The web address people use to open Documenso. Change this to
              your own domain if you put Documenso behind a reverse proxy.
        - container: NEXT_PRIVATE_INTERNAL_WEBAPP_URL
          description:
            en_US: Internal address Documenso uses to reach itself inside the container. Leave this as is.
        - container: NEXT_PRIVATE_DATABASE_URL
          description:
            en_US: >-
              Connection string for the bundled Postgres database. The
              password here must match POSTGRES_PASSWORD in the database
              service.
        - container: NEXT_PRIVATE_DIRECT_DATABASE_URL
          description:
            en_US: Direct connection string used for database migrations. Must match NEXT_PRIVATE_DATABASE_URL.
        - container: NEXT_PRIVATE_SMTP_TRANSPORT
          description:
            en_US: How Documenso sends email. Leave this as smtp-auth unless you use a different provider.
        - container: NEXT_PRIVATE_SMTP_HOST
          description:
            en_US: Your SMTP server's address, used to send signing emails.
        - container: NEXT_PRIVATE_SMTP_PORT
          description:
            en_US: Your SMTP server's port. Usually 587.
        - container: NEXT_PRIVATE_SMTP_USERNAME
          description:
            en_US: The username for logging in to your SMTP server.
        - container: NEXT_PRIVATE_SMTP_PASSWORD
          description:
            en_US: The password for logging in to your SMTP server.
        - container: NEXT_PRIVATE_SMTP_FROM_NAME
          description:
            en_US: The name shown as the sender on emails Documenso sends.
        - container: NEXT_PRIVATE_SMTP_FROM_ADDRESS
          description:
            en_US: The email address Documenso sends from.
        - container: NEXT_PRIVATE_SIGNING_PASSPHRASE
          description:
            en_US: The passphrase you set when creating your cert.p12 signing certificate.
        - container: NEXT_PRIVATE_GOOGLE_CLIENT_ID
          description:
            en_US: >-
              Optional. Client ID from a Google OAuth app, to let people sign
              in with Google. Leave blank to skip Google sign-in. Callback
              URL to register with Google: <your webapp
              URL>/api/auth/callback/google.
        - container: NEXT_PRIVATE_GOOGLE_CLIENT_SECRET
          description:
            en_US: Optional. Client secret from the same Google OAuth app as NEXT_PRIVATE_GOOGLE_CLIENT_ID. Leave blank to skip Google sign-in.
        - container: NEXT_PRIVATE_MICROSOFT_CLIENT_ID
          description:
            en_US: >-
              Optional. Application (client) ID from a Microsoft/Azure AD
              app, to let people sign in with Microsoft. Leave blank to skip
              Microsoft sign-in. Callback URL to register with Microsoft:
              <your webapp URL>/api/auth/callback/microsoft.
        - container: NEXT_PRIVATE_MICROSOFT_CLIENT_SECRET
          description:
            en_US: Optional. Client secret from the same Microsoft/Azure AD app as NEXT_PRIVATE_MICROSOFT_CLIENT_ID. Leave blank to skip Microsoft sign-in.
        - container: NEXT_PRIVATE_OIDC_WELL_KNOWN
          description:
            en_US: >-
              Optional. Well-known configuration URL from your OIDC provider
              (Authentik, Keycloak, Authelia, etc). Leave blank to skip OIDC
              sign-in.
        - container: NEXT_PRIVATE_OIDC_CLIENT_ID
          description:
            en_US: Optional. Client ID from your OIDC provider. Leave blank to skip OIDC sign-in.
        - container: NEXT_PRIVATE_OIDC_CLIENT_SECRET
          description:
            en_US: Optional. Client secret from your OIDC provider. Leave blank to skip OIDC sign-in.
        - container: NEXT_PRIVATE_OIDC_PROVIDER_LABEL
          description:
            en_US: Name shown on the OIDC sign-in button, e.g. your company name.
      ports:
        - container: "3000"
          description:
            en_US: Documenso web interface (published on host as 8446)
      volumes:
        - container: /opt/documenso/cert.p12
          description:
            en_US: >-
              Your signing certificate file. Must be created and placed on
              the host before Documenso starts for the first time.

  database:
    image: postgres:15
    container_name: database
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - POSTGRES_USER=documenso
      - POSTGRES_PASSWORD=2ac7833ce01076c3da8ea747fa8c8100
      - POSTGRES_DB=documenso
    networks:
      - documenso_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/database
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Documenso/icon.png
    x-casaos:
      id: com.hiraappstore.documenso
      envs:
        - container: POSTGRES_USER
          description:
            en_US: Database username used by Documenso. Must match the username in NEXT_PRIVATE_DATABASE_URL.
        - container: POSTGRES_PASSWORD
          description:
            en_US: >-
              Pre-filled with a random value. Must match the password in
              NEXT_PRIVATE_DATABASE_URL and NEXT_PRIVATE_DIRECT_DATABASE_URL
              in the documenso service — change all three together.
        - container: POSTGRES_DB
          description:
            en_US: Name of the database Documenso uses.
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_US: Postgres data files — your documents, signatures, and account data live here.

x-casaos:
  id: com.hiraappstore.documenso
  architectures:
    - amd64
    - arm64
  main: documenso
  author: HSinghHira
  category: Productivity
  developer: Documenso
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Documenso/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Documenso/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Docmost/thumbnail.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Docmost/thumbnail-1.png
  title:
    en_US: Documenso
  tagline:
    en_US: The open source DocuSign alternative
  description:
    en_US: >-
      Documenso is an open source document-signing platform — think DocuSign,
      but self-hosted and fully auditable.


      **Features**


      - Upload PDFs, place signature and text fields, and send documents out
        for signature

      - Own signing certificate (.p12) support for cryptographically signed,
        legally binding documents

      - Multi-recipient signing flows with email notifications

      - PostgreSQL database bundled for persistent application data

      - Open API for integrating signing into your own workflows


      **How to use?**


      1. Open Documenso from the Zima OS dashboard.

      2. Sign up to create your account. All signups become regular user
         accounts — admin access has to be granted directly in the database
         afterwards.

      3. Upload a PDF and add the recipients who need to sign it.

      4. Drag signature, date, and text fields onto the document, then send
         it out.

      5. Recipients get an email invite and sign right in their browser — no
         account required on their end.

      6. SMTP settings, signup restrictions, and storage options can be
         changed later by editing the environment variables and restarting
         the app.
  tips:
    before_install:
      en_US: >-
        1. Open the app's environment variables before you start the
           install.


        2. Find NEXT_PRIVATE_SMTP_HOST, NEXT_PRIVATE_SMTP_USERNAME,
           NEXT_PRIVATE_SMTP_PASSWORD, and NEXT_PRIVATE_SMTP_FROM_ADDRESS in
           the documenso service. They start with CHANGEME.


        3. Replace them with your real SMTP details so Documenso can send
           signing emails.


        4. Find NEXT_PRIVATE_SIGNING_PASSPHRASE. Replace CHANGEME with the
           passphrase you used when you made your cert.p12 file.


        5. NEXTAUTH_SECRET, NEXT_PRIVATE_ENCRYPTION_KEY, and
           NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY are pre-filled with random
           values. Replace them with your own before going live — generate
           new ones at randomkeygen.com.


        6. Before you start the app, make a signing certificate and copy it
           to /DATA/AppData/$AppID/cert.p12 on your device. Documenso needs
           this file to exist the first time it starts.


        7. NEXT_PUBLIC_WEBAPP_URL is set to your device's address and port.
           Change it if you use a different domain or a reverse proxy.


        7a. Google, Microsoft, and OIDC sign-in are optional. Leave
            NEXT_PRIVATE_GOOGLE_CLIENT_ID, NEXT_PRIVATE_MICROSOFT_CLIENT_ID,
            and NEXT_PRIVATE_OIDC_CLIENT_ID (and their matching secrets)
            blank if you do not want them. Fill them in with the client ID
            and secret from that provider if you do.


        8. Start the Documenso installation.


        9. Wait for the database to show healthy and for Documenso to finish
           its first-time setup. Check the logs if it takes a while.


        10. Open Documenso from the Zima OS dashboard.


        11. Sign up to create your account.


        12. To make your account an admin, you need to update it directly in
            the database.


        13. Important: POSTGRES_PASSWORD is only used the first time the
            database starts. Changing it later in the compose file will not
            change the already-created database password.
  index: /
  port_map: "8446"
  scheme: http
  is_uncontrolled: false
  release_notes:
    en_US: |-
      - Initial version

      - Pinned to a specific version tag once (2.7.0), but that tag could
        not be pulled, so this now tracks documenso/documenso:latest
        instead until a reliably-pullable version tag is confirmed
  repo: "https://github.com/documenso/documenso"
  support: "https://github.com/documenso/documenso/issues"
  docs: "https://docs.documenso.com/docs/self-hosting"