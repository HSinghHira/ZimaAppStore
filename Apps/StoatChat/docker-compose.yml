name: stoatchat

services:
  init:
    image: node:20-alpine
    container_name: stoatchat-init
    restart: "no"
    stop_grace_period: 20s
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs = require('fs');
        const crypto = require('crypto');

        if (fs.existsSync('/config/Revolt.toml')) {
          console.log('Stoat is already configured, skipping.');
          process.exit(0);
        }

        function genVapid() {
          const { publicKey, privateKey } = crypto.generateKeyPairSync('ec', { namedCurve: 'prime256v1' });
          const pubJwk = publicKey.export({ format: 'jwk' });
          const privJwk = privateKey.export({ format: 'jwk' });
          const pubRaw = Buffer.concat([
            Buffer.from([4]),
            Buffer.from(pubJwk.x, 'base64url'),
            Buffer.from(pubJwk.y, 'base64url'),
          ]);
          return { pub: pubRaw.toString('base64url'), priv: privJwk.d };
        }

        const apiVapid = genVapid();
        const pushdVapid = genVapid();
        const fileKey = crypto.randomBytes(32).toString('hex');
        const livekitKey = crypto.randomBytes(16).toString('hex');
        const livekitSecret = crypto.randomBytes(32).toString('hex');

        const revoltToml = '[database]\n' +
          'type = "MongoDB"\n' +
          'url = "mongodb://database:27017"\n\n' +
          '[redis]\n' +
          'url = "redis://redis:6379"\n\n' +
          '[rabbit]\n' +
          'host = "rabbit"\n' +
          'username = "rabbituser"\n' +
          'password = "rabbitpass"\n\n' +
          '[files]\n' +
          'storage = "s3"\n' +
          'endpoint = "http://minio:9000"\n' +
          'bucket = "revolt-uploads"\n' +
          'access_key = "minioautumn"\n' +
          'secret_key = "minioautumn"\n' +
          'encryption_key = "' + fileKey + '"\n\n' +
          '[api]\n' +
          'bind = "0.0.0.0:8000"\n\n' +
          '[api.vapid]\n' +
          'public_key = "' + apiVapid.pub + '"\n' +
          'private_key = "' + apiVapid.priv + '"\n\n' +
          '[pushd.vapid]\n' +
          'public_key = "' + pushdVapid.pub + '"\n' +
          'private_key = "' + pushdVapid.priv + '"\n\n' +
          '[api.livekit.nodes.worldwide]\n' +
          'hostname = "livekit:7880"\n' +
          'key = "' + livekitKey + '"\n' +
          'secret = "' + livekitSecret + '"\n';

        const livekitYml = 'port: 7880\n' +
          'bind_addresses:\n' +
          '  - "0.0.0.0"\n' +
          'rtc:\n' +
          '  tcp_port: 7881\n' +
          '  port_range_start: 50000\n' +
          '  port_range_end: 50100\n' +
          'keys:\n' +
          '  ' + livekitKey + ': ' + livekitSecret + '\n' +
          'redis:\n' +
          '  address: redis:6379\n';

        const caddyfile = ':80 {\n' +
          '  encode zstd gzip\n\n' +
          '  handle /api* {\n' +
          '    reverse_proxy api:8000\n' +
          '  }\n\n' +
          '  handle /ws* {\n' +
          '    reverse_proxy api:8000\n' +
          '  }\n\n' +
          '  handle /autumn* {\n' +
          '    reverse_proxy autumn:8000\n' +
          '  }\n\n' +
          '  handle /january* {\n' +
          '    reverse_proxy january:8000\n' +
          '  }\n\n' +
          '  handle /gifbox* {\n' +
          '    reverse_proxy gifbox:8000\n' +
          '  }\n\n' +
          '  handle /livekit* {\n' +
          '    reverse_proxy livekit:7880\n' +
          '  }\n\n' +
          '  handle {\n' +
          '    reverse_proxy web:5000\n' +
          '  }\n' +
          '}\n';

        fs.writeFileSync('/config/Revolt.toml', revoltToml);
        fs.writeFileSync('/config/livekit.yml', livekitYml);
        fs.writeFileSync('/config/Caddyfile', caddyfile);
        console.log('Stoat Chat configuration is ready.');
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /config
          description:
            en_US: Stoat's generated Revolt.toml, livekit.yml, and Caddyfile, with freshly generated VAPID and LiveKit keys baked in directly.

  database:
    image: mongo:8.0
    container_name: stoatchat-database
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mongodb
        target: /data/db
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /data/db
          description:
            en_US: Stores persistent Stoat database data.

  redis:
    image: eqalpha/keydb:latest
    container_name: stoatchat-redis
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  rabbit:
    image: rabbitmq:4
    container_name: stoatchat-rabbit
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - RABBITMQ_DEFAULT_USER=rabbituser
      - RABBITMQ_DEFAULT_PASS=rabbitpass
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/rabbitmq
        target: /var/lib/rabbitmq
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: RABBITMQ_DEFAULT_USER
          description:
            en_US: Internal RabbitMQ login. Only used between Stoat's own services, never reachable from outside.
        - container: RABBITMQ_DEFAULT_PASS
          description:
            en_US: Internal RabbitMQ password. Only used between Stoat's own services, never reachable from outside.
      volumes:
        - container: /var/lib/rabbitmq
          description:
            en_US: Stores internal RabbitMQ data.

  minio:
    image: minio/minio:latest
    container_name: stoatchat-minio
    restart: unless-stopped
    stop_grace_period: 60s
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioautumn
      - MINIO_ROOT_PASSWORD=minioautumn
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/minio
        target: /data
        bind:
          create_host_path: true
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: MINIO_ROOT_USER
          description:
            en_US: Internal S3 login used only by Stoat's own file server. Never reachable from outside.
        - container: MINIO_ROOT_PASSWORD
          description:
            en_US: Internal S3 password used only by Stoat's own file server. Never reachable from outside.
      volumes:
        - container: /data
          description:
            en_US: Stores uploaded files and media.

  createbuckets:
    image: minio/mc:latest
    container_name: stoatchat-createbuckets
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn; do sleep 2; done
        until /usr/bin/mc ready minio; do sleep 2; done
        /usr/bin/mc mb --ignore-existing minio/revolt-uploads
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  livekit:
    image: ghcr.io/stoatchat/livekit-server:v1.9.13
    container_name: stoatchat-livekit
    restart: unless-stopped
    stop_grace_period: 40s
    command: --config /etc/livekit.yml
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/livekit.yml
        target: /etc/livekit.yml
    ports:
      - target: 7881
        published: "8423"
        protocol: tcp
      - target: 50000
        published: "8424"
        protocol: udp
      - target: 50001
        published: "8425"
        protocol: udp
      - target: 50002
        published: "8426"
        protocol: udp
      - target: 50003
        published: "8427"
        protocol: udp
      - target: 50004
        published: "8428"
        protocol: udp
      - target: 50005
        published: "8429"
        protocol: udp
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      ports:
        - container: "7881"
          description:
            en_US: LiveKit voice TCP traffic, published on host port 8423.
        - container: "50000"
          description:
            en_US: LiveKit voice UDP traffic, published starting at host port 8424 (6 ports only, enough for a small number of concurrent calls).
      volumes:
        - container: /etc/livekit.yml
          description:
            en_US: LiveKit's own config, with its key/secret pair generated automatically on first start.

  api:
    image: ghcr.io/stoatchat/api:v0.13.8
    container_name: stoatchat-api
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  events:
    image: ghcr.io/stoatchat/events:v0.13.8
    container_name: stoatchat-events
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  autumn:
    image: ghcr.io/stoatchat/file-server:v0.13.8
    container_name: stoatchat-autumn
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  january:
    image: ghcr.io/stoatchat/proxy:v0.13.8
    container_name: stoatchat-january
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  gifbox:
    image: ghcr.io/stoatchat/gifbox:v0.13.8
    container_name: stoatchat-gifbox
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  crond:
    image: ghcr.io/stoatchat/crond:v0.13.8
    container_name: stoatchat-crond
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  pushd:
    image: ghcr.io/stoatchat/pushd:v0.13.8
    container_name: stoatchat-pushd
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  voice-ingress:
    image: ghcr.io/stoatchat/voice-ingress:v0.13.8
    container_name: stoatchat-voice-ingress
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file, generated automatically on first start.

  web:
    image: ghcr.io/stoatchat/for-web:746bee5
    container_name: stoatchat-web
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - PUBLIC_API_URL=/api
      - PUBLIC_WS_URL=/ws
      - PUBLIC_AUTUMN_URL=/autumn
      - PUBLIC_JANUARY_URL=/january
      - PUBLIC_GIFBOX_URL=/gifbox
      - PUBLIC_LIVEKIT_URL=/livekit
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  caddy:
    image: caddy:2.8-alpine
    container_name: stoatchat-caddy
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - PUBLIC_API_URL=/api
      - PUBLIC_WS_URL=/ws
      - PUBLIC_AUTUMN_URL=/autumn
      - PUBLIC_JANUARY_URL=/january
      - PUBLIC_GIFBOX_URL=/gifbox
      - PUBLIC_LIVEKIT_URL=/livekit
    depends_on:
      init:
        condition: service_completed_successfully
      web:
        condition: service_started
      api:
        condition: service_started
      autumn:
        condition: service_started
      january:
        condition: service_started
      gifbox:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - target: 80
        published: "8422"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Caddyfile
        target: /etc/caddy/Caddyfile
      - type: bind
        source: /DATA/AppData/$AppID/caddy-data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/caddy-config
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      ports:
        - container: "80"
          description:
            en_US: Stoat Chat web interface, published on host port 8422.
      volumes:
        - container: /etc/caddy/Caddyfile
          description:
            en_US: Caddy's routing rules, generated automatically on first start.
        - container: /data
          description:
            en_US: Stores Caddy runtime data.
        - container: /config
          description:
            en_US: Stores Caddy configuration data.

x-casaos:
  id: com.hiraappstore.stoatchat
  architectures:
    - amd64
  main: caddy
  author: HSinghHira
  category: Social
  developer: stoatchat
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
  # thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/thumbnail.png
  # screenshot_link:
  #   - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/thumbnail.png
  title:
    en_US: Stoat Chat
  tagline:
    en_US: A modern self-hosted chat platform that installs in one click.
  description:
    en_US: >-
      Stoat Chat is an open-source, self-hosted communication platform for
      communities, friends, and teams. This ZimaOS and CasaOS package
      includes the complete Stoat stack and automatically creates its own
      configuration and secrets on first start.


      **Features**


      - One-click installation, no manual config files needed

      - Includes MongoDB, KeyDB, RabbitMQ, MinIO, Caddy, LiveKit, and all
        required Stoat services

      - VAPID push keys, LiveKit keys, and a file encryption key are
        generated automatically and written straight into Stoat's own
        config file

      - Real-time servers, channels, direct messages, file uploads, and
        media

      - Voice communication through LiveKit

      - Only the web interface and LiveKit's voice ports are published;
        everything else stays internal

      - All application data is stored under /DATA/AppData/stoatchat


      **How to use?**


      1. Press Install.

      2. Wait for the first installation to finish — the first start takes
         a little longer while the config is generated and the database
         and file storage come up.

      3. Open Stoat Chat from the ZimaOS or CasaOS dashboard.

      4. Create your account — this becomes an ordinary user account,
         Stoat has no separate admin login.

      5. Create your first server and start chatting.

      6. Your database, file storage, message broker, and other required
         services are managed automatically.
  tips:
    before_install:
      en_US: >-
        1. Press Install — no config files to create beforehand.

        2. Wait for the first setup to finish. This takes a little longer
           than a normal restart.

        3. Do not edit or delete files under
           /DATA/AppData/stoatchat/config after the first start — Stoat's
           encryption and push keys live there, and losing them means
           losing access to existing uploads and sessions.

        4. Open Stoat Chat from the dashboard.

        5. Create your account and start chatting.
  index: /
  port_map: "8422"
  scheme: http
  is_uncontrolled: false
  version: "0.13.8"
  update_at: "2026-08-21"
  release_notes:
    en_US: |-
      - Removed env_file/secrets.env and env_file/.env.web: Docker Compose
        reads env_file paths for every service up front, before any
        container starts, so a file an init container creates at runtime
        can never satisfy it
      - VAPID keys, LiveKit key/secret, and the file encryption key are now
        written directly into Revolt.toml and livekit.yml by the init
        container, which are ordinary bind mounts the engine resolves per
        container in dependency order
      - .env.web's values were all fixed relative paths, so they're now
        plain environment entries on web and caddy, no generated file
        needed
      - Removed network_mode: bridge from every service — it was attaching
        every container to Docker's plain default bridge network instead
        of this project's own network, which breaks hostname resolution
        between sibling services (database, redis, minio, and so on)
      - Includes LiveKit voice/video this time, published on 8423 (TCP)
        and 8424-8429 (UDP, six ports)
  repo: "https://github.com/stoatchat/self-hosted"
  support: "https://github.com/stoatchat/self-hosted/issues"
  docs: "https://github.com/stoatchat/self-hosted"