name: stoatchat

services:
  init:
    image: alpine:3.21
    container_name: stoatchat-init
    restart: "no"
    stop_grace_period: 20s
    network_mode: bridge
    environment:
      - STOAT_PORT=8422
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config
        target: /config
        bind:
          create_host_path: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl >/dev/null

        if [ ! -f /config/secrets.env ]; then
          API_SECRET="$(openssl rand -hex 32)"
          LIVEKIT_KEY="$(openssl rand -hex 16)"
          LIVEKIT_SECRET="$(openssl rand -hex 32)"

          cat > /config/secrets.env <<EOF
        REVOLT__API__SECRET=$API_SECRET
        REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY=$LIVEKIT_KEY
        REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET=$LIVEKIT_SECRET
        EOF
        fi

        if [ ! -f /config/livekit.yml ]; then
          LIVEKIT_KEY="$(grep '^REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY=' /config/secrets.env | cut -d= -f2-)"
          LIVEKIT_SECRET="$(grep '^REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET=' /config/secrets.env | cut -d= -f2-)"

          cat > /config/livekit.yml <<EOF
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
        keys:
          $LIVEKIT_KEY: $LIVEKIT_SECRET
        redis:
          address: redis:6379
        EOF
        fi

        if [ ! -f /config/Revolt.toml ]; then
          cat > /config/Revolt.toml <<'EOF'
        [database]
        type = "MongoDB"
        url = "mongodb://database:27017"

        [redis]
        url = "redis://redis:6379"

        [rabbit]
        host = "rabbit"
        username = "rabbituser"
        password = "rabbitpass"

        [files]
        storage = "s3"
        endpoint = "http://minio:9000"
        bucket = "revolt-uploads"
        access_key = "minioautumn"
        secret_key = "minioautumn"

        [api]
        bind = "0.0.0.0:8000"

        [api.vapid]
        public_key = ""
        private_key = ""

        [pushd.vapid]
        public_key = ""
        private_key = ""

        [api.livekit.nodes.worldwide]
        hostname = "livekit:7880"
        key = "${REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY}"
        secret = "${REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET}"
        EOF
        fi

        if [ ! -f /config/.env.web ]; then
          cat > /config/.env.web <<'EOF'
        PUBLIC_API_URL=/api
        PUBLIC_WS_URL=/ws
        PUBLIC_AUTUMN_URL=/autumn
        PUBLIC_JANUARY_URL=/january
        PUBLIC_GIFBOX_URL=/gifbox
        PUBLIC_LIVEKIT_URL=/livekit
        EOF
        fi

        if [ ! -f /config/Caddyfile ]; then
          cat > /config/Caddyfile <<'EOF'
        :80 {
          encode zstd gzip

          handle /api* {
            reverse_proxy api:8000
          }

          handle /ws* {
            reverse_proxy api:8000
          }

          handle /autumn* {
            reverse_proxy autumn:8000
          }

          handle /january* {
            reverse_proxy january:8000
          }

          handle /gifbox* {
            reverse_proxy gifbox:8000
          }

          handle /livekit* {
            reverse_proxy livekit:7880
          }

          handle {
            reverse_proxy web:5000
          }
        }
        EOF
        fi

        echo "Stoat Chat configuration is ready."
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /config
          description:
            en_US: Stores automatically generated Stoat configuration and secrets.

  database:
    image: mongo:8.0
    container_name: stoatchat-database
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: bridge
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/mongodb
        target: /data/db
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /data/db
          description:
            en_US: Stores persistent Stoat database data.

  redis:
    image: eqalpha/keydb:latest
    container_name: stoatchat-redis
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSingHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  rabbit:
    image: rabbitmq:4
    container_name: stoatchat-rabbit
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: bridge
    environment:
      - RABBITMQ_DEFAULT_USER=rabbituser
      - RABBITMQ_DEFAULT_PASS=rabbitpass
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/rabbitmq
        target: /var/lib/rabbitmq
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /var/lib/rabbitmq
          description:
            en_US: Stores internal RabbitMQ data.

  minio:
    image: minio/minio:latest
    container_name: stoatchat-minio
    restart: unless-stopped
    stop_grace_period: 60s
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioautumn
      - MINIO_ROOT_PASSWORD=minioautumn
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/minio
        target: /data
        bind:
          create_host_path: true
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /data
          description:
            en_US: Stores uploaded files and media.

  createbuckets:
    image: minio/mc:latest
    container_name: stoatchat-createbuckets
    restart: "no"
    stop_grace_period: 30s
    network_mode: bridge
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn; do sleep 2; done
        until /usr/bin/mc ready minio; do sleep 2; done
        /usr/bin/mc mb --ignore-existing minio/revolt-uploads
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  livekit:
    image: ghcr.io/stoatchat/livekit-server:v1.9.13
    container_name: stoatchat-livekit
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    command: --config /etc/livekit.yml
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/livekit.yml
        target: /etc/livekit.yml
        bind:
          create_host_path: false
    ports:
      - target: 7881
        published: "8423"
        protocol: tcp
      - target: 50000
        published: "8424"
        protocol: udp
      - target: 50001
        published: "8425"
        protocol: udp
      - target: 50002
        published: "8426"
        protocol: udp
      - target: 50003
        published: "8427"
        protocol: udp
      - target: 50004
        published: "8428"
        protocol: udp
      - target: 50005
        published: "8429"
        protocol: udp
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      ports:
        - container: "7881"
          description:
            en_US: LiveKit voice TCP traffic published on host port 8423.
        - container: "50000"
          description:
            en_US: LiveKit voice UDP traffic begins on host port 8424.

  api:
    image: ghcr.io/stoatchat/api:v0.13.8
    container_name: stoatchat-api
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  events:
    image: ghcr.io/stoatchat/events:v0.13.8
    container_name: stoatchat-events
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  autumn:
    image: ghcr.io/stoatchat/file-server:v0.13.8
    container_name: stoatchat-autumn
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  january:
    image: ghcr.io/stoatchat/proxy:v0.13.8
    container_name: stoatchat-january
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  gifbox:
    image: ghcr.io/stoatchat/gifbox:v0.13.8
    container_name: stoatchat-gifbox
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  crond:
    image: ghcr.io/stoatchat/crond:v0.13.8
    container_name: stoatchat-crond
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  pushd:
    image: ghcr.io/stoatchat/pushd:v0.13.8
    container_name: stoatchat-pushd
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  voice-ingress:
    image: ghcr.io/stoatchat/voice-ingress:v0.13.8
    container_name: stoatchat-voice-ingress
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Revolt.toml
        target: /Revolt.toml
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  web:
    image: ghcr.io/stoatchat/for-web:746bee5
    container_name: stoatchat-web
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    env_file:
      - /DATA/AppData/stoatchat/config/.env.web
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  caddy:
    image: caddy:2.8-alpine
    container_name: stoatchat-caddy
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    depends_on:
      init:
        condition: service_completed_successfully
      web:
        condition: service_started
      api:
        condition: service_started
      autumn:
        condition: service_started
      january:
        condition: service_started
      gifbox:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - target: 80
        published: "8422"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/stoatchat/config/Caddyfile
        target: /etc/caddy/Caddyfile
        bind:
          create_host_path: false
      - type: bind
        source: /DATA/AppData/stoatchat/caddy-data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/stoatchat/caddy-config
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      ports:
        - container: "80"
          description:
            en_US: Stoat Chat web interface published on host port 8422.
      volumes:
        - container: /data
          description:
            en_US: Stores Caddy runtime data.
        - container: /config
          description:
            en_US: Stores Caddy configuration data.

x-casaos:
  id: com.hiraappstore.stoatchat
  architectures:
    - amd64
  main: caddy
  author: HSinghHira
  category: Social
  developer: stoatchat
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/icon.png
  # thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/thumbnail.png
  # screenshot_link:
  #   - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/Stoat%20Chat/thumbnail.png
  title:
    en_US: Stoat Chat
  tagline:
    en_US: A modern self-hosted chat platform that installs in one click.
  description:
    en_US: >-
      Stoat Chat is an open-source, self-hosted communication platform for
      communities, friends, and teams. This ZimaOS and CasaOS package includes
      the complete Stoat stack and automatically creates its configuration,
      services, and secrets.


      **Features**


      - One-click installation with no database or service setup required.

      - Includes MongoDB, KeyDB, RabbitMQ, MinIO, Caddy, LiveKit, and all
        required Stoat services.

      - Automatically creates and saves the required Stoat configuration.

      - Automatically creates persistent private application secrets.

      - Real-time servers, channels, direct messages, file uploads, and media.

      - Voice communication through LiveKit.

      - Only the main web interface is published on port 8422.

      - All application data is stored under /DATA/AppData/stoatchat.


      **How to use?**

      1. Press Install.

      2. Wait for the first installation to finish.

      3. Open Stoat Chat from the ZimaOS or CasaOS dashboard.

      4. Create your account.

      5. Start chatting.

      6. Your database, file storage, message broker, and other required
         services are managed automatically.

  tips:
    before_install:
      en_US: >-
        1. Press Install.

        2. Wait for the first setup to finish.

        3. Do not change or delete the files in /DATA/AppData/stoatchat/config.

        4. Open Stoat Chat from the dashboard.

        5. Create your account.

        6. Start chatting.

  index: /
  port_map: "8422"
  scheme: http
  is_uncontrolled: false
  version: "0.13.8"
  update_at: "2026-08-21"
  release_notes:
    en_US: |-
      - Initial one-click ZimaOS and CasaOS manifest.
      - Includes all required Stoat services internally.
      - Automatically creates persistent configuration and secrets.
      - Publishes the main web interface on port 8422.
  repo: "https://github.com/stoatchat/stoatchat"
  support: "https://github.com/stoatchat/self-hosted/issues"
  docs: "https://github.com/stoatchat/self-hosted"
