name: stoatchat

configs:
  stoat_caddyfile:
    content: |
      :80 {
        encode zstd gzip

        handle /api* {
          reverse_proxy api:8000
        }

        handle /ws* {
          reverse_proxy api:8000
        }

        handle /autumn* {
          reverse_proxy autumn:8000
        }

        handle /january* {
          reverse_proxy january:8000
        }

        handle /gifbox* {
          reverse_proxy gifbox:8000
        }

        handle /livekit* {
          reverse_proxy livekit:7880
        }

        handle {
          reverse_proxy web:5000
        }
      }
  stoat_revolt_toml:
    content: |
      [database]
      type = "MongoDB"
      url = "mongodb://database:27017"

      [redis]
      url = "redis://redis:6379"

      [rabbit]
      host = "rabbit"
      username = "rabbituser"
      password = "rabbitpass"

      [files]
      storage = "s3"
      endpoint = "http://minio:9000"
      bucket = "revolt-uploads"
      access_key = "minioautumn"
      secret_key = "minioautumn"

      [api]
      bind = "0.0.0.0:8000"

      [api.vapid]
      public_key = ""
      private_key = ""

      [pushd.vapid]
      public_key = ""
      private_key = ""

      [api.livekit.nodes.worldwide]
      hostname = "livekit:7880"
      key = ""
      secret = ""
  stoat_livekit_yml:
    content: |
      port: 7880
      bind_addresses:
        - "0.0.0.0"
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 50100
      redis:
        address: redis:6379

services:
  database:
    image: mongo:8.0
    container_name: stoatchat-database
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mongodb
        target: /data/db
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /data/db
          description:
            en_US: Stores persistent Stoat database data.

  redis:
    image: eqalpha/keydb:latest
    container_name: stoatchat-redis
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  rabbit:
    image: rabbitmq:4
    container_name: stoatchat-rabbit
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - RABBITMQ_DEFAULT_USER=rabbituser
      - RABBITMQ_DEFAULT_PASS=rabbitpass
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/rabbitmq
        target: /var/lib/rabbitmq
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: RABBITMQ_DEFAULT_USER
          description:
            en_US: Internal RabbitMQ login. Only used between Stoat's own services, never reachable from outside.
        - container: RABBITMQ_DEFAULT_PASS
          description:
            en_US: Internal RabbitMQ password. Only used between Stoat's own services, never reachable from outside.
      volumes:
        - container: /var/lib/rabbitmq
          description:
            en_US: Stores internal RabbitMQ data.

  minio:
    image: minio/minio:latest
    container_name: stoatchat-minio
    restart: unless-stopped
    stop_grace_period: 60s
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioautumn
      - MINIO_ROOT_PASSWORD=minioautumn
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/minio
        target: /data
        bind:
          create_host_path: true
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: MINIO_ROOT_USER
          description:
            en_US: Internal S3 login used only by Stoat's own file server. Never reachable from outside.
        - container: MINIO_ROOT_PASSWORD
          description:
            en_US: Internal S3 password used only by Stoat's own file server. Never reachable from outside.
      volumes:
        - container: /data
          description:
            en_US: Stores uploaded files and media.

  createbuckets:
    image: minio/mc:latest
    container_name: stoatchat-createbuckets
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn; do sleep 2; done
        until /usr/bin/mc ready minio; do sleep 2; done
        /usr/bin/mc mb --ignore-existing minio/revolt-uploads
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  livekit:
    image: ghcr.io/stoatchat/livekit-server:v1.9.13
    container_name: stoatchat-livekit
    restart: unless-stopped
    stop_grace_period: 40s
    command: --config /etc/livekit.yml
    environment:
      - "LIVEKIT_KEYS=CHANGEME_livekit_key: CHANGEME_livekit_secret"
    configs:
      - source: stoat_livekit_yml
        target: /etc/livekit.yml
    depends_on:
      redis:
        condition: service_started
    ports:
      - target: 7881
        published: "8423"
        protocol: tcp
      - target: 50000
        published: "8424"
        protocol: udp
      - target: 50001
        published: "8425"
        protocol: udp
      - target: 50002
        published: "8426"
        protocol: udp
      - target: 50003
        published: "8427"
        protocol: udp
      - target: 50004
        published: "8428"
        protocol: udp
      - target: 50005
        published: "8429"
        protocol: udp
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: LIVEKIT_KEYS
          description:
            en_US: "Format: key: secret. Make up any two random strings (openssl rand -hex 16 for the key, openssl rand -hex 32 for the secret). Must exactly match the LiveKit key/secret you enter on the api and voice-ingress services below."
      ports:
        - container: "7881"
          description:
            en_US: LiveKit voice TCP traffic, published on host port 8423.
        - container: "50000"
          description:
            en_US: LiveKit voice UDP traffic, published starting at host port 8424 (6 ports only, enough for a small number of concurrent calls).

  api:
    image: ghcr.io/stoatchat/api:v0.13.8
    container_name: stoatchat-api
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - REVOLT__API__VAPID__PUBLIC_KEY=CHANGEME_vapid_public_key
      - REVOLT__API__VAPID__PRIVATE_KEY=CHANGEME_vapid_private_key
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY=CHANGEME_livekit_key
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET=CHANGEME_livekit_secret
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: REVOLT__API__VAPID__PUBLIC_KEY
          description:
            en_US: Web-push public key. Generate a real EC keypair with the one-time command in this app's install notes — do not leave as CHANGEME.
        - container: REVOLT__API__VAPID__PRIVATE_KEY
          description:
            en_US: Web-push private key, paired with the public key above. Keep this secret.
        - container: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY
          description:
            en_US: Must exactly match LIVEKIT_KEYS's key half on the livekit service.
        - container: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET
          description:
            en_US: Must exactly match LIVEKIT_KEYS's secret half on the livekit service.

  events:
    image: ghcr.io/stoatchat/events:v0.13.8
    container_name: stoatchat-events
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  autumn:
    image: ghcr.io/stoatchat/file-server:v0.13.8
    container_name: stoatchat-autumn
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  january:
    image: ghcr.io/stoatchat/proxy:v0.13.8
    container_name: stoatchat-january
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  gifbox:
    image: ghcr.io/stoatchat/gifbox:v0.13.8
    container_name: stoatchat-gifbox
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  crond:
    image: ghcr.io/stoatchat/crond:v0.13.8
    container_name: stoatchat-crond
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  pushd:
    image: ghcr.io/stoatchat/pushd:v0.13.8
    container_name: stoatchat-pushd
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - REVOLT__PUSHD__VAPID__PUBLIC_KEY=CHANGEME_vapid_public_key
      - REVOLT__PUSHD__VAPID__PRIVATE_KEY=CHANGEME_vapid_private_key
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: REVOLT__PUSHD__VAPID__PUBLIC_KEY
          description:
            en_US: Must exactly match REVOLT__API__VAPID__PUBLIC_KEY on the api service — same keypair, used by a different Stoat service.
        - container: REVOLT__PUSHD__VAPID__PRIVATE_KEY
          description:
            en_US: Must exactly match REVOLT__API__VAPID__PRIVATE_KEY on the api service — same keypair, used by a different Stoat service.

  voice-ingress:
    image: ghcr.io/stoatchat/voice-ingress:v0.13.8
    container_name: stoatchat-voice-ingress
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY=CHANGEME_livekit_key
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET=CHANGEME_livekit_secret
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      livekit:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY
          description:
            en_US: Must exactly match LIVEKIT_KEYS's key half on the livekit service, and the same field on the api service.
        - container: REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET
          description:
            en_US: Must exactly match LIVEKIT_KEYS's secret half on the livekit service, and the same field on the api service.

  web:
    image: ghcr.io/stoatchat/for-web:746bee5
    container_name: stoatchat-web
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - PUBLIC_API_URL=/api
      - PUBLIC_WS_URL=/ws
      - PUBLIC_AUTUMN_URL=/autumn
      - PUBLIC_JANUARY_URL=/january
      - PUBLIC_GIFBOX_URL=/gifbox
      - PUBLIC_LIVEKIT_URL=/livekit
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat

  caddy:
    image: caddy:2.8-alpine
    container_name: stoatchat-caddy
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      autumn:
        condition: service_started
      january:
        condition: service_started
      gifbox:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - target: 80
        published: "8422"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/caddy-data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/caddy-config
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    x-casaos:
      id: com.hiraappstore.stoatchat
      ports:
        - container: "80"
          description:
            en_US: Stoat Chat web interface, published on host port 8422.
      volumes:
        - container: /data
          description:
            en_US: Stores Caddy runtime data.
        - container: /config
          description:
            en_US: Stores Caddy configuration data.

x-casaos:
  id: com.hiraappstore.stoatchat
  architectures:
    - amd64
  main: caddy
  author: HSinghHira
  category: Social
  developer: stoatchat
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
  # thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/thumbnail.png
  # screenshot_link:
  #   - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/thumbnail.png
  title:
    en_US: Stoat Chat
  tagline:
    en_US: A modern self-hosted chat platform, Discord-style.
  description:
    en_US: >-
      Stoat Chat is an open-source, self-hosted communication platform for
      communities, friends, and teams.


      **Features**


      - Includes MongoDB, KeyDB, RabbitMQ, MinIO, Caddy, LiveKit, and all
        required Stoat services

      - Real-time servers, channels, direct messages, file uploads, and
        media

      - Voice communication through LiveKit

      - Only the web interface and LiveKit's voice ports are published;
        everything else stays internal

      - All application data is stored under /DATA/AppData/stoatchat


      **Before you install**


      This app needs three secrets generated once, before the first
      install — see the install notes for the exact one-line commands to
      generate them.


      **How to use?**


      1. Generate the secrets described in the install notes and paste
         them into the matching fields below.

      2. Press Install.

      3. Open Stoat Chat from the ZimaOS or CasaOS dashboard.

      4. Create your account — this becomes an ordinary user account,
         Stoat has no separate admin login.

      5. Create your first server and start chatting.
  tips:
    before_install:
      en_US: >-
        1. This app needs three secrets generated once, on any machine
           with Docker or OpenSSL, before you install.


        2. Run: openssl rand -hex 16 — this is your LiveKit key.


        3. Run: openssl rand -hex 32 — this is your LiveKit secret.


        4. Run this to get a VAPID keypair (paste the whole thing as one
           command):
           docker run --rm node:20-alpine node -e "const c=require('crypto');const{publicKey,privateKey}=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});const p=publicKey.export({format:'jwk'});const s=privateKey.export({format:'jwk'});const r=Buffer.concat([Buffer.from([4]),Buffer.from(p.x,'base64url'),Buffer.from(p.y,'base64url')]);console.log('PUBLIC:',r.toString('base64url'));console.log('PRIVATE:',s.d);"


        5. You now have 4 values: a LiveKit key, a LiveKit secret, a VAPID
           public key, and a VAPID private key.


        6. Fill in LIVEKIT_KEYS on the livekit service using the format
           key: secret, with your generated LiveKit key and secret.


        7. Fill in the matching LiveKit key/secret fields on the api and
           voice-ingress services — they must match LIVEKIT_KEYS exactly.


        8. Fill in the VAPID public/private key fields on the api
           service, and the same two values again on the pushd service.


        9. Press Install once every CHANGEME field above is replaced.


        10. Open Stoat Chat from the dashboard on port 8422.


        11. The first account you make is a normal user account, not an
            admin account. Stoat has no separate admin login.
  index: /
  port_map: "8422"
  scheme: http
  is_uncontrolled: false
  version: "0.13.8"
  update_at: "2026-08-22"
  release_notes:
    en_US: |-
      - Removed the init container and every dynamically-created bind
        mount for Revolt.toml, livekit.yml, and Caddyfile — CasaOS creates
        every service's bind mounts up front, not strictly in depends_on
        order, so those paths kept getting auto-vivified as empty
        directories before the init container ever ran
      - Revolt.toml, livekit.yml, and Caddyfile are now Compose configs:
        (static inline content), which Compose materializes directly with
        no host file and no race condition
      - VAPID keys and the LiveKit key/secret are now plain environment
        placeholders (CHANGEME_*) generated once by the person installing,
        the same pattern used elsewhere in this store
      - Includes LiveKit voice/video, published on 8423 (TCP) and
        8424-8429 (UDP, six ports)
  repo: "https://github.com/stoatchat/self-hosted"
  support: "https://github.com/stoatchat/self-hosted/issues"
  docs: "https://github.com/stoatchat/self-hosted"