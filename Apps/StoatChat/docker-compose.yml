name: stoatchat

services:
  config-init:
    image: docker.io/node:20-bookworm-slim
    container_name: stoatchat-config-init
    restart: "no"
    environment:
      - STOAT_HOSTNAME=CHANGEME_192.168.1.50:8422
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        if [ -f /config/secrets.env ]; then
          echo "Stoat is already configured, skipping."
          exit 0
        fi
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git bash curl openssl ca-certificates
        rm -rf /tmp/stoat-src
        git clone --depth 1 https://github.com/stoatchat/self-hosted /tmp/stoat-src
        cd /tmp/stoat-src
        chmod +x ./generate_config.sh
        yes y | ./generate_config.sh "$STOAT_HOSTNAME"
        cp -f Revolt.toml secrets.env .env.web Caddyfile stoat.json /config/
        echo "Stoat config generated for $STOAT_HOSTNAME"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: STOAT_HOSTNAME
          description:
            en_US: Your NAS's LAN IP or domain, followed by :8422 (this app's port). Example 192.168.1.50:8422. Get this right before first install — Stoat bakes it into the config on first start only, and changing it later means wiping the config folder and losing access to existing uploads.
      volumes:
        - container: /config
          description:
            en_US: Stoat's generated Revolt.toml, secrets.env, .env.web, Caddyfile, and stoat.json. Made automatically on first start by the official generate_config.sh script.

  database:
    image: docker.io/mongo:latest
    container_name: stoatchat-database
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/db
        target: /data/db
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.00"
          memory: 256M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /data/db
          description:
            en_US: Stoat's MongoDB database. All servers, messages, and user records live here.

  redis:
    image: docker.io/eqalpha/keydb:latest
    container_name: stoatchat-redis
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    x-casaos:
      id: com.hiraappstore.stoatchat

  rabbit:
    image: docker.io/rabbitmq:4
    container_name: stoatchat-rabbit
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - RABBITMQ_DEFAULT_USER=rabbituser
      - RABBITMQ_DEFAULT_PASS=rabbitpass
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/rabbit
        target: /var/lib/rabbitmq
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: RABBITMQ_DEFAULT_USER
          description:
            en_US: Internal RabbitMQ login. Only used between Stoat's own services, never reachable from outside. Matches upstream's default, safe to leave as-is.
        - container: RABBITMQ_DEFAULT_PASS
          description:
            en_US: Internal RabbitMQ password. Only used between Stoat's own services, never reachable from outside. Matches upstream's default, safe to leave as-is.
      volumes:
        - container: /var/lib/rabbitmq
          description:
            en_US: RabbitMQ's own message queue data.

  minio:
    image: docker.io/minio/minio:latest
    container_name: stoatchat-minio
    restart: unless-stopped
    stop_grace_period: 40s
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioautumn
      - MINIO_ROOT_PASSWORD=minioautumn
      - MINIO_DOMAIN=minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/minio
        target: /data
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
    x-casaos:
      id: com.hiraappstore.stoatchat
      envs:
        - container: MINIO_ROOT_USER
          description:
            en_US: Internal S3 login used only by Stoat's own file server. Never reachable from outside. Matches upstream's default, safe to leave as-is.
        - container: MINIO_ROOT_PASSWORD
          description:
            en_US: Internal S3 password used only by Stoat's own file server. Never reachable from outside. Matches upstream's default, safe to leave as-is.
      volumes:
        - container: /data
          description:
            en_US: All uploaded files, avatars, banners, icons, and emojis, stored as S3 objects.

  createbuckets:
    image: docker.io/minio/mc:latest
    container_name: stoatchat-createbuckets
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
      /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
      echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.00"
          memory: 32M
    x-casaos:
      id: com.hiraappstore.stoatchat

  api:
    image: ghcr.io/stoatchat/api:v0.13.8
    container_name: stoatchat-api
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  events:
    image: ghcr.io/stoatchat/events:v0.13.8
    container_name: stoatchat-events
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  autumn:
    image: ghcr.io/stoatchat/file-server:v0.13.8
    container_name: stoatchat-autumn
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  january:
    image: ghcr.io/stoatchat/proxy:v0.13.8
    container_name: stoatchat-january
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  gifbox:
    image: ghcr.io/stoatchat/gifbox:v0.13.8
    container_name: stoatchat-gifbox
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.00"
          memory: 32M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  crond:
    image: ghcr.io/stoatchat/crond:v0.13.8
    container_name: stoatchat-crond
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.00"
          memory: 32M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  pushd:
    image: ghcr.io/stoatchat/pushd:v0.13.8
    container_name: stoatchat-pushd
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Revolt.toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.00"
          memory: 32M
    x-casaos:
      id: com.hiraappstore.stoatchat
      volumes:
        - container: /Revolt.toml
          description:
            en_US: Stoat's shared configuration file. Made automatically on first start by the official generate_config.sh script.

  web:
    image: ghcr.io/stoatchat/for-web:746bee5
    container_name: stoatchat-web
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/.env.web
    depends_on:
      config-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    x-casaos:
      id: com.hiraappstore.stoatchat

  caddy:
    image: docker.io/caddy:latest
    container_name: stoatchat-caddy
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - /DATA/AppData/stoatchat/config/.env.web
    depends_on:
      config-init:
        condition: service_completed_successfully
    ports:
      - target: 8880
        published: "8422"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/Caddyfile
        target: /etc/caddy/Caddyfile
      - type: bind
        source: /DATA/AppData/$AppID/config/stoat.json
        target: /stoat.json
      - type: bind
        source: /DATA/AppData/$AppID/caddy-data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/caddy-config
        target: /config
        bind:
          create_host_path: true
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    x-casaos:
      id: com.hiraappstore.stoatchat
      ports:
        - container: "8880"
          description:
            en_US: Stoat's single web entry point (web app, API, file server, and proxy all route through here), published on host as 8422
      volumes:
        - container: /etc/caddy/Caddyfile
          description:
            en_US: Caddy's routing rules. Made automatically on first start by the official generate_config.sh script.
        - container: /stoat.json
          description:
            en_US: Trusted-domain list used by Caddy. Made automatically on first start by the official generate_config.sh script.
        - container: /data
          description:
            en_US: Caddy's own TLS certificates and state.
        - container: /config
          description:
            en_US: Caddy's own runtime configuration.

x-casaos:
  id: com.hiraappstore.stoatchat
  architectures:
    - amd64
    - arm64
  main: caddy
  author: HSinghHira
  category: Social
  developer: stoatchat
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/icon.png
  # thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/thumbnail.png
  # screenshot_link:
  #   - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/StoatChat/thumbnail.png
  title:
    en_US: Stoat Chat
  tagline:
    en_US: Self-hosted, user-first chat for your own community
  description:
    en_US: >-
      Stoat (formerly Revolt) is an open-source, self-hosted chat platform
      that looks and feels like Discord — servers, channels, roles, custom
      emoji, and file sharing — without handing your community's data to a
      third party.


      **Features**


      - Servers, channels, roles, and permissions, just like Discord

      - Custom emoji, animated avatars, and profile banners with no
        subscription required

      - Group DMs with up to 50 members

      - A public API for bots and custom clients

      - MongoDB for all server, message, and user data

      - MinIO (S3-compatible) storage for uploads, avatars, and emoji

      - RabbitMQ and KeyDB power real-time events and push notifications

      - Config is generated automatically on first start by Stoat's own
        setup script — no files to hand-create before installing

      - This manifest covers text chat only — voice and video (LiveKit) are
        not included, so it stays a manageable single-port install


      **How to use?**


      1. Open Stoat Chat from the ZimaAppStore dashboard.

      2. You'll land on the Stoat web app. Create the first account — this
         becomes an ordinary user, so make it your own account first.

      3. Create your first server from the "+" button on the server list.

      4. Add channels, invite people with a server invite link, and set up
         roles under server settings.

      5. Install the Stoat mobile or desktop app and point it at your
         instance's address if you don't want to use the web app.

      6. Ongoing settings (registration rules, captcha, email verification,
         upload limits) live in Revolt.toml on the host and take a container
         restart to apply.
  tips:
    before_install:
      en_US: >-
        1. Before you install, set the STOAT_HOSTNAME field on the
           config-init service.


        2. Put in your NAS's LAN IP, followed by :8422. Example:
           192.168.1.50:8422.


        3. Use a domain instead of an IP if you have one, still followed
           by :8422.


        4. Get this right before install. Stoat only builds its config
           once, the first time it starts.


        5. Start the Stoat Chat installation.


        6. The first start takes a minute or two longer than normal. A
           setup step is downloading Stoat's official config tool and
           building your config file.


        7. Wait about a minute more after that. MongoDB and MinIO need a
           moment to finish setting up too.


        8. Open Stoat Chat from the ZimaAppStore dashboard on port 8422.


        9. The first account you make is a normal user account, not an
           admin account. Stoat has no separate admin login.


        10. Important: secrets.env holds the keys that let you decrypt
            your own uploaded files. Back up the whole config folder.


        11. Important: changing STOAT_HOSTNAME after first install does
            nothing by itself. To change it, delete everything in the
            config folder and restart, which builds fresh secrets and
            loses access to old files.


        12. Important: changing Revolt.toml later needs a restart of the
            api, events, autumn, january, gifbox, crond, and pushd
            containers to take effect.
  index: /
  port_map: "8422"
  scheme: http
  is_uncontrolled: false
  version: "0.13.8"
  update_at: "2026-08-21"
  release_notes:
    en_US: |-
      - Config is now generated automatically by a config-init container
        that runs Stoat's own generate_config.sh on first start, driven by
        a single STOAT_HOSTNAME field
      - Fixes env_file paths that previously relied on $AppID, which
        CasaOS only rewrites inside native volumes bind-mount sources, not
        env_file entries
      - Ships text chat only; LiveKit voice/video is left out to keep this
        to a single published port
      - Caddy is the only published service; api, events, autumn, january,
        gifbox, crond, pushd, web, database, redis, rabbit, and minio all
        stay on the internal network
  repo: "https://github.com/stoatchat/self-hosted"
  support: "https://github.com/stoatchat/self-hosted/issues"
  docs: "https://github.com/stoatchat/self-hosted/blob/main/README.md"