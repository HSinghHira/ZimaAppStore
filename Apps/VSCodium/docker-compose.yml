name: vscodium-web

services:
  vscodium-web:
    image: lscr.io/linuxserver/vscodium-web:latest
    container_name: vscodium-web
    restart: unless-stopped
    stop_grace_period: 20s
    network_mode: bridge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CONNECTION_TOKEN=7e134abfbd9cd7662938d2d98e0a057104429a40c45a9c10034d31512a107f12
      - SUDO_PASSWORD=CHANGEME
      - CODE_ARGS=
    ports:
      - target: 8000
        published: "8451"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.00"
          memory: 256M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VSCodiumWeb/icon.png
    x-casaos:
      id: com.hiraappstore.vscodiumweb
      envs:
        - container: PUID
          description:
            en_US: The user ID that owns your files in the config folder. Should match a real user on this ZimaOS box.
        - container: PGID
          description:
            en_US: The group ID that owns your files in the config folder. Should match a real group on this ZimaOS box.
        - container: TZ
          description:
            en_US: The timezone used inside the container, for example Etc/UTC.
        - container: CONNECTION_TOKEN
          description:
            en_US: Pre-filled with a random value. This token guards access to the web UI - you must add ?tkn=<this value> to the URL to get in. Replace it with your own before relying on this app for anything sensitive.
        - container: SUDO_PASSWORD
          description:
            en_US: Pre-filled placeholder. Set your own password here to get sudo access inside the built-in terminal. Leave the placeholder and you will not have sudo access.
        - container: CODE_ARGS
          description:
            en_US: Optional. Extra command line flags to pass to the VSCodium binary. Leave blank unless you know you need one.
      ports:
        - container: "8000"
          description:
            en_US: Web UI for VSCodium in the browser (published on host as 8451).
      volumes:
        - container: /config
          description:
            en_US: Your VSCodium home directory. Stores editor settings, installed extensions, SSH keys under .ssh, and any project files you keep here.

x-casaos:
  id: com.hiraappstore.vscodiumweb
  architectures:
    - amd64
    - arm64
  main: vscodium-web
  author: HSinghHira
  category: Developer
  developer: linuxserver.io
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VSCodiumWeb/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VSCodiumWeb/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VSCodiumWeb/thumbnail.png
  title:
    en_US: VSCodium
  tagline:
    en_US: The open-source VS Code editor, ready to use in your browser, no desktop streaming needed.
  description:
    en_US: >-
      VSCodium Web runs the browser-native remote host component of
      VSCodium, the community-driven, freely-licensed build of Microsoft's
      VS Code editor. Unlike the full desktop version, this loads straight
      into a lightweight web page — no remote desktop session in the way.


      **Features**


      - The real VSCodium editor UI, running natively in your browser

      - Built-in terminal with optional sudo access

      - Drop an SSH key into .ssh for git and GitHub access

      - Optional token-based access control for the web UI

      - Persistent config, extensions, and projects under
        /DATA/AppData/$AppID


      **How to use?**


      1. Open VSCodium from the Zima OS dashboard.

      2. If a connection token is set, add ?tkn=<your token> to the end of
         the URL to get in, example: http://[IP_ADDRESS]?tkn=<your-token>

      3. Open a terminal from the top menu to run git config or install
         extra tools.

      4. Drop an SSH key into the .ssh folder inside your config directory
         to use git over SSH.

      5. Install VSCodium extensions and start editing your projects.

      6. Change the connection token, sudo password, or CLI arguments
         later by editing the vscodium-web service's environment
         variables.
  tips:
    before_install:
      en_US: >-
        1. Open the app settings before you start the install.


        2. Find PUID and PGID in the vscodium-web service.


        3. Set them to match a real user and group ID on this ZimaOS box.


        4. Find CONNECTION_TOKEN in the vscodium-web service. It is
           pre-filled with a random value.


        5. Replace it with your own token, or make up a new random one at
           randomkeygen.com, before you rely on this app for anything
           sensitive.


        6. Find SUDO_PASSWORD in the vscodium-web service. It is a
           placeholder.


        7. Change it to a password you make up if you want sudo access in
           the built-in terminal. Leave it as is if you do not want sudo
           access.


        8. Set TZ to your local timezone.


        9. Start the VSCodium Web installation.


        10. Open VSCodium Web from the Zima OS dashboard.


        11. If you set a connection token, add ?tkn=<your token> to the
            end of the URL the first time you connect.


        12. More settings, like extra CLI flags, live in the
            vscodium-web service's environment variables.
  index: /
  port_map: "8451"
  scheme: http
  is_uncontrolled: false
  release_notes:
    en_US: |-
      - Initial version. linuxserver/vscodium-web only publishes a floating latest tag (plus arch tags like amd64-<version>), so version and update_at are left out here.
  repo: "https://github.com/linuxserver/docker-vscodium-web"
  support: "https://github.com/linuxserver/docker-vscodium-web/issues"
  docs: "https://docs.linuxserver.io/images/docker-vscodium-web/"
