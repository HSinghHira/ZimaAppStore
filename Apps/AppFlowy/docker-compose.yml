  tips:
    before_install:
      en_US: >-
        1. Open the app configuration before you install.


        2. Find `GOTRUE_ADMIN_EMAIL` in the `gotrue` service. Set it to your
        email.


        3. Find `GOTRUE_ADMIN_PASSWORD` in the `gotrue` service. It is random.
        Write it down, or use your own from
        [randomkeygen.com](https://randomkeygen.com/).


        4. The links start with `http://localhost:8474`. That only works on the
        ZimaOS box itself.


        5. To use AppFlowy on other devices, you need an `https://` address.
        For example, a Cloudflare tunnel.


        6. Put that address in `APPFLOWY_BASE_URL` and `APPFLOWY_WEB_URL` in
        `appflowy_cloud`. Put it in `APPFLOWY_S3_PRESIGNED_URL_ENDPOINT` too,
        and add `/minio-api` at the end.


        7. Put it in `API_EXTERNAL_URL` in `gotrue`, and add `/gotrue` at the
        end.


        8. In `appflowy_web`, set `APPFLOWY_BASE_URL` to the address. Add
        `/gotrue` for `APPFLOWY_GOTRUE_BASE_URL`. Add `/ws/v2` for
        `APPFLOWY_WS_BASE_URL`, and start it with `wss://`.


        9. In `minio`, put it in `MINIO_BROWSER_REDIRECT_URL`, and add `/minio`
        at the end.


        10. Other passwords are random. Leave them alone unless you know what
        you are doing. If you change one, change its match in the other
        services too.


        11. The database and file passwords only work on the first start. Do not
        change them later.


        12. Start the install. Wait a few minutes. The database starts first.


        13. Open AppFlowy from the Zima OS dashboard. Sign in with your admin
        email and password.


        14. Anyone who can open the page can sign up. To stop that, set
        `GOTRUE_DISABLE_SIGNUP` to true in the `gotrue` service.
