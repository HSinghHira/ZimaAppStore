name: vert

services:
  vert:
    image: ghcr.io/vert-sh/vert:latest
    container_name: vert
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    ports:
      - target: 80
        published: "8420"
        protocol: tcp
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VERT/icon.png
    x-casaos:
      id: com.hiraappstore.vert
      ports:
        - container: "80"
          description:
            en_US: VERT web interface (published on host as 8420)

x-casaos:
  id: com.hiraappstore.vert
  architectures:
    - amd64
    - arm64
  main: vert
  author: HSinghHira
  category: Productivity
  developer: VERT-sh
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VERT/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VERT/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VERT/thumbnail.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/VERT/thumbnail-1.png
  title:
    en_US: VERT
  tagline:
    en_US: Convert files locally in your browser using WebAssembly — no uploads, no cloud
  description:
    en_US: >-
      VERT is an open-source, next-generation file converter that runs
      conversions directly on your device using WebAssembly instead of
      uploading files to a cloud service, think a private, self-hosted
      alternative to online conversion sites.


      **Features**


      - Local, in-browser conversion for images, audio, and documents using
        WebAssembly (ImageMagick, FFmpeg, and Pandoc under the hood) — those
        files never leave your device

      - Supports 250+ file formats across images, audio, documents, and video

      - No file size limits and no ads

      - Video conversion is resource-intensive, so by default it runs
        through VERT's official shared "vertd" servers; the vertd daemon
        can be self-hosted separately later for fully local video
        conversion

      - Fully stateless static frontend — no database, nothing to back up


      **How to use?**


      1. Open VERT from the Zima OS dashboard.

      2. Drop a file onto the upload box, or click it to browse for one.

      3. Choose the format you want to convert it to.

      4. Adjust any conversion settings shown for that format, if you want.

      5. Click convert, then download the result once it finishes.

      6. Video files convert through VERT's shared vertd servers
         automatically — there's nothing to set up for that.
  tips:
    before_install:
      en_US: >-
        1. There is nothing to set up before installing.


        2. Start the VERT installation.


        3. Open VERT from the Zima OS dashboard.


        4. Drop a file to convert it.


        5. Video conversion uses VERT's shared servers by default. You do
           not need to configure anything for that.
  index: /
  port_map: "8420"
  scheme: http
  is_uncontrolled: false
  release_notes:
    en_US: |-
      - Initial version.
      - Upstream only publishes a floating `latest` tag (plus per-commit
        `sha-*` tags) via ghcr.io/vert-sh/vert, so no versioned release
        exists yet to pin against.
  repo: "https://github.com/VERT-sh/VERT"
  support: "https://github.com/VERT-sh/VERT/issues"
  docs: "https://github.com/VERT-sh/VERT/blob/main/docs/GETTING_STARTED.md"
