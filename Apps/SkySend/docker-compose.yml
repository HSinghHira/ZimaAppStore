name: skysend

services:
  skysend:
    image: skyfay/skysend:v2.11.3
    container_name: skysend
    restart: unless-stopped
    stop_grace_period: 15s
    network_mode: bridge
    environment:
      - BASE_URL=CHANGEME_BASE_URL
      - PORT=
      - HOST=
      - DATA_DIR=
      - UPLOADS_DIR=
      - BRANDING_DIR=
      - TRUST_PROXY=
      - CORS_ORIGINS=
      - FILE_MAX_SIZE=
      - FILE_MAX_FILES_PER_UPLOAD=
      - FILE_EXPIRE_OPTIONS_SEC=
      - FILE_DEFAULT_EXPIRE_SEC=
      - FILE_DOWNLOAD_OPTIONS=
      - FILE_DEFAULT_DOWNLOAD=
      - FILE_UPLOAD_QUOTA_BYTES=
      - FILE_UPLOAD_QUOTA_WINDOW=
      - FILE_UPLOAD_CONCURRENT_CHUNKS=
      - FILE_UPLOAD_SPEED_LIMIT=
      - FILE_UPLOAD_WS=
      - FILE_UPLOAD_WS_MAX_BUFFER=
      - NOTE_MAX_SIZE=
      - NOTE_EXPIRE_OPTIONS_SEC=
      - NOTE_DEFAULT_EXPIRE_SEC=
      - NOTE_VIEW_OPTIONS=
      - NOTE_DEFAULT_VIEWS=
      - ENABLED_SERVICES=
      - CLEANUP_INTERVAL=
      - RATE_LIMIT_WINDOW=
      - RATE_LIMIT_MAX=
      - PASSWORD_MAX_ATTEMPTS=
      - PASSWORD_LOCKOUT_MS=
      - STORAGE_BACKEND=
      - S3_BUCKET=
      - S3_REGION=
      - S3_ENDPOINT=
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - S3_FORCE_PATH_STYLE=
      - S3_PRESIGNED_EXPIRY=
      - S3_PART_SIZE=
      - S3_CONCURRENCY=
      - CUSTOM_TITLE=
      - CUSTOM_COLOR=
      - CUSTOM_LOGO=
      - CUSTOM_PRIVACY=
      - CUSTOM_LEGAL=
      - CUSTOM_LINK_URL=
      - CUSTOM_LINK_NAME=
      - CUSTOM_REPORT_URL=
      - DEFAULT_THEME=
      - DEFAULT_TAB=
      - FORCE_FILE_PASSWORD=
      - FORCE_NOTE_PASSWORD=
      - OIDC_PROVIDER=
      - OIDC_ISSUER=
      - OIDC_CLIENT_ID=
      - OIDC_CLIENT_SECRET=
      - OIDC_SESSION_SECRET=
      - OIDC_PROTECT_FILES=
      - OIDC_PROTECT_NOTES=
      - OIDC_REDIRECT_URI=
      - OIDC_SCOPES=
      - OIDC_SESSION_DURATION=
      - PUID=
      - PGID=
      - SKIP_CHOWN=
    ports:
      - target: 3000
        published: "8447"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/uploads
        target: /uploads
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/icon.png
    x-casaos:
      id: com.hiraappstore.skysend
      envs:
        - container: PORT
          description:
            en_US: "(Optional) Server port inside the container. Default is 3000. Only change this if you also update the container-side port mapping above."
        - container: HOST
          description:
            en_US: "(Optional) Server bind address inside the container. Default is 0.0.0.0. Leave this blank unless you know you need something else."
        - container: BASE_URL
          description:
            en_US: "The public URL people will use to reach SkySend, like http://192.168.1.50:8447. This is used for links and login redirects, so set it to the address you will actually visit, not localhost."
        - container: DATA_DIR
          description:
            en_US: "(Optional) Directory inside the container for the database. Default is ./data. Leave this blank; the /data volume already covers this."
        - container: UPLOADS_DIR
          description:
            en_US: "(Optional) Directory inside the container for encrypted upload files. Default is /uploads in Docker. Leave this blank; the /uploads volume already covers this."
        - container: BRANDING_DIR
          description:
            en_US: "(Optional) Directory inside the container for your own branding assets, served under /branding/. Default is {DATA_DIR}/branding. Leave this blank unless you need a custom path."
        - container: TRUST_PROXY
          description:
            en_US: "(Optional) Trust X-Forwarded-For and X-Real-IP headers. Default is false. Set to true if SkySend sits behind a reverse proxy."
        - container: CORS_ORIGINS
          description:
            en_US: "(Optional) Extra allowed CORS origins, comma-separated. Default is empty. Leave blank unless another site needs to call this SkySend instance."
        - container: FILE_MAX_SIZE
          description:
            en_US: "(Optional) Maximum file upload size, e.g. 2GB. Default is 2GB. Leave blank to use the default."
        - container: FILE_MAX_FILES_PER_UPLOAD
          description:
            en_US: "(Optional) Maximum number of files per multi-file upload. Default is 32. Leave blank to use the default."
        - container: FILE_EXPIRE_OPTIONS_SEC
          description:
            en_US: "(Optional) Comma-separated list of selectable file expiry times in seconds. Default is 300,3600,86400,604800. Leave blank to use the default."
        - container: FILE_DEFAULT_EXPIRE_SEC
          description:
            en_US: "(Optional) Default file expiry time in seconds. Must be one of FILE_EXPIRE_OPTIONS_SEC. Default is 86400. Leave blank to use the default."
        - container: FILE_DOWNLOAD_OPTIONS
          description:
            en_US: "(Optional) Comma-separated list of selectable download limits. Default is 1,2,3,4,5,10,20,50,100. Leave blank to use the default."
        - container: FILE_DEFAULT_DOWNLOAD
          description:
            en_US: "(Optional) Default download limit. Must be one of FILE_DOWNLOAD_OPTIONS. Default is 1. Leave blank to use the default."
        - container: FILE_UPLOAD_QUOTA_BYTES
          description:
            en_US: "(Optional) Maximum upload volume per user per time window. 0 means unlimited. Default is 0. Leave blank to use the default."
        - container: FILE_UPLOAD_QUOTA_WINDOW
          description:
            en_US: "(Optional) Upload quota time window in seconds. Default is 86400 (24 hours). Leave blank to use the default."
        - container: FILE_UPLOAD_CONCURRENT_CHUNKS
          description:
            en_US: "(Optional) Number of parallel upload chunks per session (1-20). Default is 3. Leave blank to use the default."
        - container: FILE_UPLOAD_SPEED_LIMIT
          description:
            en_US: "(Optional) Maximum upload speed per session in bytes per second. 0 means unlimited. Default is 0. Leave blank to use the default."
        - container: FILE_UPLOAD_WS
          description:
            en_US: "(Optional) Enable the WebSocket upload transport for faster uploads. Default is true. Set to false if WebSockets are blocked in your setup."
        - container: FILE_UPLOAD_WS_MAX_BUFFER
          description:
            en_US: "(Optional) Maximum bytes buffered per WebSocket upload session. Default is 16MB. Leave blank to use the default."
        - container: NOTE_MAX_SIZE
          description:
            en_US: "(Optional) Maximum note content size. Default is 1MB. Leave blank to use the default."
        - container: NOTE_EXPIRE_OPTIONS_SEC
          description:
            en_US: "(Optional) Comma-separated list of selectable note expiry times in seconds. Default is 300,3600,86400,604800. Leave blank to use the default."
        - container: NOTE_DEFAULT_EXPIRE_SEC
          description:
            en_US: "(Optional) Default note expiry time in seconds. Must be one of NOTE_EXPIRE_OPTIONS_SEC. Default is 86400. Leave blank to use the default."
        - container: NOTE_VIEW_OPTIONS
          description:
            en_US: "(Optional) Comma-separated list of selectable note view limits. Default is 0,1,2,3,5,10,20,50,100. Leave blank to use the default."
        - container: NOTE_DEFAULT_VIEWS
          description:
            en_US: "(Optional) Default view limit for notes. 0 means unlimited, 1 means burn-after-reading. Default is 0. Leave blank to use the default."
        - container: ENABLED_SERVICES
          description:
            en_US: "(Optional) Which services are turned on: file, note, or file,note. Default is file,note. Leave blank to use the default."
        - container: CLEANUP_INTERVAL
          description:
            en_US: "(Optional) How often the automatic cleanup job runs, in seconds. Default is 60. Leave blank to use the default."
        - container: RATE_LIMIT_WINDOW
          description:
            en_US: "(Optional) Rate limit window in milliseconds. Default is 60000. Leave blank to use the default."
        - container: RATE_LIMIT_MAX
          description:
            en_US: "(Optional) Maximum requests per window per IP. Default is 60. Leave blank to use the default."
        - container: PASSWORD_MAX_ATTEMPTS
          description:
            en_US: "(Optional) Failed password attempts allowed before an IP is locked out of an upload or note. Default is 10. Leave blank to use the default."
        - container: PASSWORD_LOCKOUT_MS
          description:
            en_US: "(Optional) Lockout duration in milliseconds after too many failed password attempts. Default is 900000 (15 minutes). Leave blank to use the default."
        - container: STORAGE_BACKEND
          description:
            en_US: "(Optional) Storage backend to use: filesystem or s3. Default is filesystem. Leave blank unless you want S3-compatible storage."
        - container: S3_BUCKET
          description:
            en_US: "(Optional) S3 bucket name. Required only if STORAGE_BACKEND is set to s3."
        - container: S3_REGION
          description:
            en_US: "(Optional) S3 region, e.g. eu-central-1. Required only if STORAGE_BACKEND is set to s3."
        - container: S3_ENDPOINT
          description:
            en_US: "(Optional) Custom S3 endpoint URL. Required for non-AWS providers like R2, Hetzner, or MinIO. Leave blank for AWS S3."
        - container: S3_ACCESS_KEY
          description:
            en_US: "(Optional) S3 access key ID. Required only if STORAGE_BACKEND is set to s3."
        - container: S3_SECRET_KEY
          description:
            en_US: "(Optional) S3 secret access key. Required only if STORAGE_BACKEND is set to s3. Keep this private."
        - container: S3_FORCE_PATH_STYLE
          description:
            en_US: "(Optional) Use path-style S3 URLs instead of virtual-hosted-style. Default is false. Needed for MinIO, Garage, and some self-hosted providers."
        - container: S3_PRESIGNED_EXPIRY
          description:
            en_US: "(Optional) Presigned download URL expiry in seconds. Default is 300. Leave blank to use the default."
        - container: S3_PART_SIZE
          description:
            en_US: "(Optional) Size of each S3 multipart upload part. Default is 25MB, minimum 5MB. Leave blank to use the default."
        - container: S3_CONCURRENCY
          description:
            en_US: "(Optional) Number of S3 parts uploaded in parallel (1-16). Default is 4. Leave blank to use the default."
        - container: CUSTOM_TITLE
          description:
            en_US: "(Optional) Site title shown in the UI. Default is SkySend. Leave blank to use the default."
        - container: CUSTOM_COLOR
          description:
            en_US: "(Optional) Primary brand color as a 6-digit hex code, e.g. 46c89d. Leave blank to use the default look."
        - container: CUSTOM_LOGO
          description:
            en_US: "(Optional) Path or URL to a custom logo, e.g. /branding/logo.svg. Leave blank to use the default logo."
        - container: CUSTOM_PRIVACY
          description:
            en_US: "(Optional) URL to your privacy policy page, shown as a footer link. Leave blank to hide it."
        - container: CUSTOM_LEGAL
          description:
            en_US: "(Optional) URL to your legal notice / impressum page, shown as a footer link. Leave blank to hide it."
        - container: CUSTOM_LINK_URL
          description:
            en_US: "(Optional) URL for a custom footer link. Must be set together with CUSTOM_LINK_NAME. Leave blank to skip."
        - container: CUSTOM_LINK_NAME
          description:
            en_US: "(Optional) Display text for the custom footer link (max 50 characters). Must be set together with CUSTOM_LINK_URL."
        - container: CUSTOM_REPORT_URL
          description:
            en_US: "(Optional) URL to a report/abuse page, shown as a footer link. Leave blank to hide it."
        - container: DEFAULT_THEME
          description:
            en_US: "(Optional) Default theme for new visitors: dark, light, or system. Default is system. Leave blank to use the default."
        - container: DEFAULT_TAB
          description:
            en_US: "(Optional) Default upload tab shown on open: file, text, password, code, or sshkey. Default is file. Leave blank to use the default."
        - container: FORCE_FILE_PASSWORD
          description:
            en_US: "(Optional) Require a password on every file upload. Default is false. Leave blank to use the default."
        - container: FORCE_NOTE_PASSWORD
          description:
            en_US: "(Optional) Require a password on every note. Default is false. Leave blank to use the default."
        - container: OIDC_PROVIDER
          description:
            en_US: "(Optional) OIDC provider preset: generic, pocketid, authentik, or keycloak. Default is generic. Leave blank unless using SSO."
        - container: OIDC_ISSUER
          description:
            en_US: "(Optional) Issuer URL of your OIDC provider. Setting this together with OIDC_CLIENT_ID and OIDC_CLIENT_SECRET turns on SSO login."
        - container: OIDC_CLIENT_ID
          description:
            en_US: "(Optional) Client ID registered with your OIDC provider. Must be set together with OIDC_ISSUER and OIDC_CLIENT_SECRET."
        - container: OIDC_CLIENT_SECRET
          description:
            en_US: "(Optional) Client secret registered with your OIDC provider. Must be set together with OIDC_ISSUER and OIDC_CLIENT_ID. Keep this private."
        - container: OIDC_SESSION_SECRET
          description:
            en_US: "(Optional) Secret used to sign session cookies, at least 32 characters. If left blank, a random one is generated on every restart, logging everyone out each time. Generate one at randomkeygen.com if you use SSO."
        - container: OIDC_PROTECT_FILES
          description:
            en_US: "(Optional) Require login to upload files when SSO is active. Default is true. Leave blank to use the default."
        - container: OIDC_PROTECT_NOTES
          description:
            en_US: "(Optional) Require login to create notes when SSO is active. Default is true. Leave blank to use the default."
        - container: OIDC_REDIRECT_URI
          description:
            en_US: "(Optional) Override the OAuth2 callback URL. Only needed if SkySend runs under a sub-path or behind a proxy that changes the origin."
        - container: OIDC_SCOPES
          description:
            en_US: "(Optional) Space-separated OIDC scopes to request. Default is openid profile email. Leave blank to use the default."
        - container: OIDC_SESSION_DURATION
          description:
            en_US: "(Optional) Session cookie lifetime in seconds. Default is 86400 (24 hours). Leave blank to use the default."
        - container: PUID
          description:
            en_US: "(Optional) User ID the container runs as. Default is 1001. Leave blank to use the default."
        - container: PGID
          description:
            en_US: "(Optional) Group ID the container runs as. Default is 1001. Leave blank to use the default."
        - container: SKIP_CHOWN
          description:
            en_US: "(Optional) Skip chown of /data and /uploads on startup. Default is false. Set to true only for NFS mounts or read-only filesystems where chown is not allowed."
      ports:
        - container: "3000"
          description:
            en_US: Web UI for uploading and downloading encrypted files and notes (published on host as 8447)
      volumes:
        - container: /data
          description:
            en_US: SkySend's database and any custom branding assets you add
        - container: /uploads
          description:
            en_US: The encrypted file blobs people upload. SkySend never sees the unencrypted contents.

x-casaos:
  id: com.hiraappstore.skysend
  architectures:
    - amd64
    - arm64
  main: skysend
  author: HSinghHira
  category: Productivity
  developer: Skyfay
  icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/thumbnail.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/thumbnail-1.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/thumbnail-2.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/thumbnail-3.png
    - https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/SkySend/thumbnail-4.png
  title:
    en_US: SkySend
  tagline:
    en_US: End-to-end encrypted, zero-knowledge file and note sharing
  description:
    en_US: >-
      SkySend is a minimalist, end-to-end encrypted file and note sharing
      service. Files and notes are encrypted entirely in your browser before
      upload, so the server only ever stores encrypted blobs and never sees
      the decryption key.


      **Features**


      - Drag-and-drop file and folder uploads, with configurable expiry and
        download limits

      - Encrypted notes: plain text, Markdown, code snippets, passwords, and
        SSH keys, with optional burn-after-reading

      - Optional password protection using GPU-resistant Argon2id key
        derivation

      - Optional OIDC / SSO login to restrict who can upload, while downloads
        stay public

      - Optional S3-compatible storage backend (AWS S3, R2, MinIO, and more)
        alongside the default local filesystem storage

      - No accounts and no telemetry, with an upload/note dashboard tracked
        locally in your browser

      - Persistent database and uploads stored under
        /DATA/AppData/$AppID


      **How to use?**

      1. Open SkySend from the Zima OS dashboard.

      2. Drag a file onto the page, or switch to the Notes tab to share text,
         a password, code, or an SSH key instead.

      3. Set an expiry time and download/view limit, and optionally add a
         password.

      4. Copy the generated share link and send it to whoever needs it. The
         decryption key lives only in that link, never on the server.

      5. Open the dashboard tab to see your own upload/note history, which is
         stored locally in your browser, not on the server.

      6. Extra settings like custom branding, S3 storage, and OIDC login are
         all listed below and can be filled in any time without rebuilding
         the container.
  tips:
    before_install:
      en_US: >-
        1. Open the app configuration before starting the installation.

        2. Find BASE_URL in the skysend service. It is set to
           CHANGEME_BASE_URL.

        3. Change it to the address you will use to open SkySend, like
           http://192.168.1.50:8447. Do not use localhost.

        4. Every other environment variable is optional and starts blank.
           Leave them blank to use SkySend's built-in defaults.

        5. Only fill in the S3_* variables if you want to use S3-compatible
           storage instead of local storage. Set STORAGE_BACKEND to s3 too.

        6. Only fill in the OIDC_* variables if you want SSO login.
           OIDC_ISSUER, OIDC_CLIENT_ID, and OIDC_CLIENT_SECRET must all be
           filled in together, or SkySend will not start.

        7. If you use OIDC, also set OIDC_SESSION_SECRET to a random value
           from randomkeygen.com so people stay logged in after a restart.

        8. Start the SkySend installation.

        9. Open SkySend from the Zima OS dashboard.

        10. Try uploading a small file to make sure everything works.

        11. You can come back and fill in any blank variable later. Just
            restart the app after changing one.
  index: /
  port_map: "8447"
  scheme: http
  is_uncontrolled: false
  version: "2.11.3"
  update_at: "2026-09-08"
  release_notes:
    en_US: |-
      - Initial version, pinned to skyfay/skysend:v2.11.3
      - Exposed every documented SkySend environment variable as an optional field
  repo: "https://github.com/Skyfay/SkySend"
  support: "https://github.com/Skyfay/SkySend/issues"
  docs: "https://docs.skysend.app"