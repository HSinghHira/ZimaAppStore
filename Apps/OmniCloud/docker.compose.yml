networks:
  omnicloud_network:
    name: omnicloud
    driver: bridge
    ipam: {}
    external: false
services:
  api:
    build:
      context: https://github.com/dimartarmizi/OmniCloud.git
      dockerfile: backend/Dockerfile
    command: null
    container_name: omnicloud-api
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: "1.00"
        reservations:
          memory: 128MB
          cpus: "0.10"
      placement: {}
    entrypoint: null
    environment:
      APP_MODE: local
      AUTH_COOKIE_NAME: omnicloud_session
      AUTH_SECRET: 7d06de2aca264ad1ff0a1727ec98983c95b751d9bba1958e7edacfa69445c8be
      AUTH_SESSION_TTL_HOURS: "336"
      CORS_ORIGIN: http://[IP_ADDRESS:PORT]
      DATABASE_PATH: /app/data/omnicloud.db
      DROPBOX_CLIENT_ID: CHANGEME_DROPBOX_CLIENT_ID
      DROPBOX_CLIENT_SECRET: CHANGEME_DROPBOX_CLIENT_SECRET
      DROPBOX_REDIRECT_URI: http://[IP_ADDRESS:PORT]/api/accounts/dropbox/callback
      FRONTEND_URL: http://[IP_ADDRESS:PORT]
      GOOGLE_CLIENT_ID: CHANGEME_GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET: CHANGEME_GOOGLE_CLIENT_SECRET
      GOOGLE_REDIRECT_URI: http://[IP_ADDRESS:PORT]/api/accounts/google/callback
      OMNICLOUD_SECRET_HALF: ff9752efae2afb79ed1c07706eb84ce6e38b39e7a386c44e14702e5a2b3332d5
      ONEDRIVE_CLIENT_ID: CHANGEME_ONEDRIVE_CLIENT_ID
      ONEDRIVE_CLIENT_SECRET: CHANGEME_ONEDRIVE_CLIENT_SECRET
      ONEDRIVE_REDIRECT_URI: http://[IP_ADDRESS:PORT]/api/accounts/onedrive/callback
      ONEDRIVE_TENANT_ID: common
      PORT: "8787"
      SYNC_INTERVAL_MINUTES: "5"
      YANDEX_CLIENT_ID: CHANGEME_YANDEX_CLIENT_ID
      YANDEX_CLIENT_SECRET: CHANGEME_YANDEX_CLIENT_SECRET
      YANDEX_REDIRECT_URI: http://[IP_ADDRESS:PORT]/api/accounts/yandex/callback
    image: ghcr.io/hsinghhira/omnicloud-api:sha-e87fb59
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/OmniCloud/icon.png
    networks:
      - omnicloud_network
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - type: bind
        source: /DATA/AppData/omnicloud/data
        target: /app/data
        bind:
          create_host_path: true
  web:
    build:
      context: https://github.com/dimartarmizi/OmniCloud.git
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: /ws/uploads
    command: null
    container_name: omnicloud-web
    depends_on:
      api:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: 256MB
          cpus: "0.50"
        reservations:
          memory: 64MB
          cpus: "0.05"
      placement: {}
    entrypoint: null
    image: ghcr.io/hsinghhira/omnicloud-web:sha-e87fb59
    labels:
      icon: https://cdn.jsdelivr.net/gh/HSinghHira/ZimaAppStore@main/Apps/OmniCloud/icon.png
    networks:
      - omnicloud_network
    ports:
      - target: 80
        published: "8442"
        protocol: tcp
    restart: unless-stopped
    stop_grace_period: 40s
    volumes: []
x-casaos:
  architectures:
    - amd64
    - arm64
  author: HSinghHira
  category: Productivity
