name: pocket-id
services:
  pocket-id:
    command:
    container_name: pocket-id
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
        reservations:
          memory: 128M
          cpus: "0.10"
      placement: {}
    entrypoint:
    environment:
      APP_URL: CHANGEME_YOUR_SERVER_URL
      ENCRYPTION_KEY: re5nBm+ya8Q1Rgsjn6dY+l+2v/KyM4T7je14nYXMqvY=
      TRUST_PROXY: "false"
      MAXMIND_LICENSE_KEY: ""
      PGID: "1000"
      PUID: "1000"
      UI_CONFIG_DISABLED: "true"
      ALLOW_USER_SIGNUPS: disabled
      ANALYTICS_DISABLED: "false"
      VERSION_CHECK_DISABLED: "false"
    healthcheck:
      test:
        - CMD
        - /app/pocket-id
        - healthcheck
      timeout: 5s
      interval: 1m30s
      retries: 2
      start_period: 10s
    image: ghcr.io/pocket-id/pocket-id:latest@sha256:c5aa2a62484509e1ce7f604e1a10122e0e67995f57ecbb4a3e46b794127aaf25
    network_mode: bridge
    ports:
      - target: 1411
        published: "8436"
        protocol: tcp
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - type: bind
        source: /DATA/AppData/pocket-id
        target: /app/data
        bind:
          create_host_path: true
x-casaos:
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.pocketid/assets/icon.png
  id: com.hiraappstore.pocketid
  index: /
  main: pocket-id
  port_map: "8436"
  scheme: http
  title:
    custom: Pocket ID
    en_US: Pocket ID
  version: 2.14.0
