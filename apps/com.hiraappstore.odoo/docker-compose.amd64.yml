name: odoo

services:
  odoo:
    image: odoo:20.0@sha256:a9e8e6b30e89eb29b2074489ad31dd285a2776f3479cce1ccedfa04722a3057b
    container_name: odoo
    restart: unless-stopped
    stop_grace_period: 40s
    command: ["odoo", "--http-interface=0.0.0.0"]
    networks:
      - odoo_network
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      - TZ=$TZ
      - HOST=odoo-db
      - PORT=5432
      - USER=odoo
      - PASSWORD=fc31404056b54c31b68aea9ff081b61f
    ports:
      - target: 8069
        published: "8479"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /var/lib/odoo
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/addons
        target: /mnt/extra-addons
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.00"
          memory: 512M
  odoo-db:
    image: postgres:16@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
    container_name: odoo-db
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - odoo_network
    environment:
      - TZ=$TZ
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=fc31404056b54c31b68aea9ff081b61f
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/db
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.00"
          memory: 128M
networks:
  odoo_network:
    name: odoo_network

x-casaos:
  id: com.hiraappstore.odoo
  main: odoo
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.odoo/assets/icon.png
  title:
    en_US: Odoo
  index: /
  port_map: "8479"
  scheme: http
  version: "20.0"
