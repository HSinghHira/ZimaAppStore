name: opengym

services:
  media:
    image: alpine/git:latest@sha256:1e9d9a40acbd02aeb3cb005ff43f9e51ac09ba0c241bb2298f811d3f426a2ffd
    container_name: opengym-media
    restart: "no"
    networks:
      - opengym_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
        fi
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/media/img
        target: /out/img
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/media/gif
        target: /out/gif
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
  api:
    image: registry.gitlab.com/duartesantos8/opengym/api:latest@sha256:875ea3018cde03524a67a53496eac942f7d2786b1190eef2b78ae10d7aa639cb
    container_name: opengym-api
    restart: unless-stopped
    stop_grace_period: 40s
    networks:
      - opengym_network
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - RP_ID=CHANGEME_RP_ID
      - ORIGIN=CHANGEME_ORIGIN
      - RP_NAME=openGym
      - SESSION_DAYS=90
      - COACH_DISABLED=1
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
  web:
    image: registry.gitlab.com/duartesantos8/opengym/web:latest@sha256:c59393788271c980f5a5574a8849c87a81c83851eecb95f899fe61e4b85079af
    container_name: opengym-web
    restart: unless-stopped
    stop_grace_period: 40s
    networks:
      - opengym_network
    depends_on:
      - media
      - api
    ports:
      - target: 80
        published: "8435"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/media/img
        target: /usr/share/nginx/html/img
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/media/gif
        target: /usr/share/nginx/html/gif
        read_only: true
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
networks:
  opengym_network:
    driver: bridge

x-casaos:
  id: com.hiraappstore.opengym
  main: web
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.opengym/assets/icon.png
  title:
    en_US: openGym
  index: /
  port_map: "8435"
  scheme: http
