name: yuvomi

services:
  yuvomi:
    image: ghcr.io/ulsklyc/yuvomi:2.63.0
    container_name: yuvomi
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/yuvomi.db
      - BACKUP_DIR=/backups
      - SESSION_SECRET=b91786feb2057122d4e4843a813d59eb8ffe7f5237dda5aec6f7ea58550da44f
      - DB_ENCRYPTION_KEY=ab153c16785771fc859e9adcc27ffea5d071f613802cdd4d0a809cf25141bed1
      - SESSION_SECURE=false
      - TZ=UTC
    ports:
      - target: 3000
        published: "8434"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/backups
        target: /backups
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/modules
        target: /app/modules
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 256M
x-casaos:
  id: com.hiraappstore.yuvomi
  main: yuvomi
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.yuvomi/assets/icon.png
  title:
    en_US: Yuvomi
  index: /
  port_map: "8434"
  scheme: http
  version: "2.63.0"
