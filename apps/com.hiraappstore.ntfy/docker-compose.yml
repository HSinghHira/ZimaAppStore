name: ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    init: true
    command: serve
    environment:
      TZ: $TZ
      NTFY_BASE_URL: "http://localhost:8473"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: "/var/lib/ntfy/cache.db"
      NTFY_AUTH_FILE: "/var/lib/ntfy/auth.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_ENABLE_LOGIN: "true"
      NTFY_REQUIRE_LOGIN: "true"
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
      NTFY_AUTH_USERS: "admin:$$2b$$10$$1C8wtZx6f6Fkm8W07PXZyObBN9OY1GlOAGbOA79M4yV1oKjf5kR5S:admin"
    ports:
      - target: 80
        published: "8473"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /var/lib/ntfy
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://127.0.0.1:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
x-casaos:
  id: com.hiraappstore.ntfy
  main: ntfy
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.ntfy/assets/icon.png
  title:
    en_US: ntfy
  index: /
  port_map: "8473"
  scheme: http
  version: "2.28.0"
