name: watchyourlan

services:
  watchyourlan:
    image: aceberg/watchyourlan:2.1.4@sha256:b7671d2e9116a629c287e5c58c68636e405da59eda4f8799141fa79648ff47ae
    container_name: watchyourlan
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: host
    environment:
      - TZ=UTC
      - IFACES=CHANGEME_IFACE
      - PORT=8421
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data/WatchYourLAN
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
x-casaos:
  id: com.hiraappstore.watchyourlan
  main: watchyourlan
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.watchyourlan/assets/icon.png
  title:
    en_US: WatchYourLAN
  index: /
  port_map: "8421"
  scheme: http
  version: "2.1.4"
