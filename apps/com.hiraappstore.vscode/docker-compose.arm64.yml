name: vscode

services:
  vscode:
    image: lscr.io/linuxserver/vscode:latest@sha256:a6bda35bacb14771870433f9e1730b1d34e5bccfa2c3ea6bf5760b12b4fa0856
    container_name: vscode
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: bridge
    cap_add:
      - IPC_LOCK
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CUSTOM_USER=CHANGEME_USERNAME
      - PASSWORD=CHANGEME_PASSWORD
    ports:
      - target: 3000
        published: "8449"
        protocol: tcp
      - target: 3001
        published: "8450"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4096M
        reservations:
          cpus: "0.00"
          memory: 512M
x-casaos:
  id: com.hiraappstore.vscode
  main: vscode
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.vscode/assets/icon.png
  title:
    en_US: VS Code
  index: /
  port_map: "8450"
  scheme: https
