name: stoatchat

configs:
  stoat_caddyfile:
    content: |
      :80 {
        encode zstd gzip

        handle /api* {
          reverse_proxy api:8000
        }

        handle /ws* {
          reverse_proxy api:8000
        }

        handle /autumn* {
          reverse_proxy autumn:8000
        }

        handle /january* {
          reverse_proxy january:8000
        }

        handle /gifbox* {
          reverse_proxy gifbox:8000
        }

        handle /livekit* {
          reverse_proxy livekit:7880
        }

        handle {
          reverse_proxy web:5000
        }
      }
  stoat_revolt_toml:
    content: |
      [database]
      type = "MongoDB"
      url = "mongodb://database:27017"

      [redis]
      url = "redis://redis:6379"

      [rabbit]
      host = "rabbit"
      username = "rabbituser"
      password = "rabbitpass"

      [files]
      storage = "s3"
      endpoint = "http://minio:9000"
      bucket = "revolt-uploads"
      access_key = "minioautumn"
      secret_key = "minioautumn"

      [api]
      bind = "0.0.0.0:8000"

      [api.security.captcha]
      hcaptcha_key = "0x0000000000000000000000000000000000000000"
      hcaptcha_sitekey = "10000000-ffff-ffff-ffff-000000000001"

      [api.vapid]
      public_key = ""
      private_key = ""

      [pushd.vapid]
      public_key = ""
      private_key = ""

      [api.livekit.nodes.worldwide]
      hostname = "livekit:7880"
      key = ""
      secret = ""
  stoat_livekit_yml:
    content: |
      port: 7880
      bind_addresses:
        - "0.0.0.0"
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 50100
      redis:
        address: redis:6379

services:
  database:
    image: mongo:8.0@sha256:376f5173003b5408d7b8e6989667231c0bf0cefdce379d7c814910429d1a7a85
    container_name: stoatchat-database
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mongodb
        target: /data/db
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
  redis:
    image: eqalpha/keydb:latest@sha256:eceb1806730c7850395b8262300182c2e15a6e5dacbf0b72cbab110518caf43f
    container_name: stoatchat-redis
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
  rabbit:
    image: rabbitmq:4@sha256:cb038b7a48d8b73507c83ff446245546a9459ac53e9ce79615217b4fbd917d50
    container_name: stoatchat-rabbit
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - RABBITMQ_DEFAULT_USER=rabbituser
      - RABBITMQ_DEFAULT_PASS=rabbitpass
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/rabbitmq
        target: /var/lib/rabbitmq
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  minio:
    image: minio/minio:latest@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: stoatchat-minio
    restart: unless-stopped
    stop_grace_period: 60s
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioautumn
      - MINIO_ROOT_PASSWORD=minioautumn
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/minio
        target: /data
        bind:
          create_host_path: true
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  createbuckets:
    image: minio/mc:latest@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    container_name: stoatchat-createbuckets
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn; do sleep 2; done
        until /usr/bin/mc ready minio; do sleep 2; done
        /usr/bin/mc mb --ignore-existing minio/revolt-uploads
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
  livekit:
    image: ghcr.io/stoatchat/livekit-server:v1.9.13@sha256:b27a75433ea5e2ece9cee61834ac8a8916916f1c634fff6e0585465a2dcdb181
    container_name: stoatchat-livekit
    restart: unless-stopped
    stop_grace_period: 40s
    command: --config /etc/livekit.yml
    environment:
      - "LIVEKIT_KEYS=7c4cff3b1ee23bb0874ec4420816c2a2: 85a4d1c5f5d17e4ab2d0352ddb2cdabfe1da13d523b4b1f1da8a9e3e8c9f41bd"
    configs:
      - source: stoat_livekit_yml
        target: /etc/livekit.yml
    depends_on:
      redis:
        condition: service_started
    ports:
      - target: 7881
        published: "8423"
        protocol: tcp
      - target: 50000
        published: "8424"
        protocol: udp
      - target: 50001
        published: "8425"
        protocol: udp
      - target: 50002
        published: "8426"
        protocol: udp
      - target: 50003
        published: "8427"
        protocol: udp
      - target: 50004
        published: "8428"
        protocol: udp
      - target: 50005
        published: "8429"
        protocol: udp
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
  api:
    image: ghcr.io/stoatchat/api:v0.13.8@sha256:a11b2ac299a156880d882d73bba3b8523efde516743deffab779b0627c99e7e3
    container_name: stoatchat-api
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - REVOLT__API__VAPID__PUBLIC_KEY=BMHJ0YgfIFgVehh91a_Pg-GVSocLnZEdGwPct-tqcR4JOD7ymOPaHxPBUYCIHRHFi6nv-OtiwOzmX1xB1-ZBizw
      - REVOLT__API__VAPID__PRIVATE_KEY=evRmVlW91Wq2oAtim5co_wWuQ9tDqkaTvgiO-ZotcNY
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY=7c4cff3b1ee23bb0874ec4420816c2a2
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET=85a4d1c5f5d17e4ab2d0352ddb2cdabfe1da13d523b4b1f1da8a9e3e8c9f41bd
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
  events:
    image: ghcr.io/stoatchat/events:v0.13.8@sha256:dcc08010a69ea1797ffeed60b2a274443a8095cab2c0e8ce15b913555e6ae484
    container_name: stoatchat-events
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  autumn:
    image: ghcr.io/stoatchat/file-server:v0.13.8@sha256:b2d28a1ee6b0b5108302a7cc534e3d5c616bcd65f2d76be49fad73cba8b82998
    container_name: stoatchat-autumn
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  january:
    image: ghcr.io/stoatchat/proxy:v0.13.8@sha256:faa35870269b902a0c1a6aea9966bb47e249f055138aa9a0238ff8c76c2e4f57
    container_name: stoatchat-january
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  gifbox:
    image: ghcr.io/stoatchat/gifbox:v0.13.8@sha256:bc4e55f67e8b94d7d34589b35b1b2c2acec6905975c00fa75a34bb204b9342b8
    container_name: stoatchat-gifbox
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  crond:
    image: ghcr.io/stoatchat/crond:v0.13.8@sha256:84fb2db019da1b3ec07f57762481aaa9b75bae709f2d282e00a60b8d5a3b498d
    container_name: stoatchat-crond
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
  pushd:
    image: ghcr.io/stoatchat/pushd:v0.13.8@sha256:b0bff45156a4dcde6601e9d0f8f57462af1e936b833acaf76a15c7a66529f7e1
    container_name: stoatchat-pushd
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - REVOLT__PUSHD__VAPID__PUBLIC_KEY=BMHJ0YgfIFgVehh91a_Pg-GVSocLnZEdGwPct-tqcR4JOD7ymOPaHxPBUYCIHRHFi6nv-OtiwOzmX1xB1-ZBizw
      - REVOLT__PUSHD__VAPID__PRIVATE_KEY=evRmVlW91Wq2oAtim5co_wWuQ9tDqkaTvgiO-ZotcNY
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
  voice-ingress:
    image: ghcr.io/stoatchat/voice-ingress:v0.13.8@sha256:1e4b33f3d8613b42b8e85042f8fa94e720dd658425c0db7dabb9bf936132a145
    container_name: stoatchat-voice-ingress
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY=7c4cff3b1ee23bb0874ec4420816c2a2
      - REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET=85a4d1c5f5d17e4ab2d0352ddb2cdabfe1da13d523b4b1f1da8a9e3e8c9f41bd
    configs:
      - source: stoat_revolt_toml
        target: /Revolt.toml
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      livekit:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  web:
    image: ghcr.io/stoatchat/for-web:746bee5@sha256:56ecc6733dd6d0bb0bb53f81f801be578eac835e63d7f644650cf6dd39881286
    container_name: stoatchat-web
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - PUBLIC_API_URL=/api
      - PUBLIC_WS_URL=/ws
      - PUBLIC_AUTUMN_URL=/autumn
      - PUBLIC_JANUARY_URL=/january
      - PUBLIC_GIFBOX_URL=/gifbox
      - PUBLIC_LIVEKIT_URL=/livekit
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
  caddy:
    image: caddy:2.8-alpine@sha256:b95ed06fbc6d74d24a40902090c8cc6086ce7d08ba60a3a7e8e62bf164a9d7bb
    container_name: stoatchat-caddy
    restart: unless-stopped
    stop_grace_period: 40s
    configs:
      - source: stoat_caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      autumn:
        condition: service_started
      january:
        condition: service_started
      gifbox:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - target: 80
        published: "8422"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/caddy-data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/caddy-config
        target: /config
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
x-casaos:
  id: com.hiraappstore.stoatchat
  main: caddy
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.stoatchat/assets/icon.png
  title:
    en_US: Stoat Chat
  index: /
  port_map: "8422"
  scheme: http
  version: "0.13.8"
