name: homelable

services:
  backend:
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:ff947ad35654357cf891133c6d3e49357aa952635d73d9d2f15c9059692751e9
    container_name: homelable-backend
    restart: unless-stopped
    stop_grace_period: 40s
    cap_add:
      - NET_RAW
    environment:
      SQLITE_PATH: /app/data/homelab.db
      SECRET_KEY: 966ce567ecd086995723ff4d8ae712823102667503eacb97234cc8c7c7a79aac
      AUTH_USERNAME: admin
      AUTH_PASSWORD_HASH: $2a$12$sAi.frLLWflLR4lCUufIOeEOCHaNT75FvbCDUvB7AVn/GjdkY2vuS
      CORS_ORIGINS: '["http://localhost:8431"]'
      SCANNER_RANGES: '["192.168.1.0/24"]'
      STATUS_CHECKER_INTERVAL: "60"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/backend
        target: /app/data
        bind:
          create_host_path: true
    networks:
      - homelable_network
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.00"
          memory: 128M
  frontend:
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:61ec870ae76b11cd8659fd00fd8a2ada57852ec5eb019da0e164127e11bf3a00
    container_name: homelable-frontend
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      - backend
    ports:
      - target: 80
        published: "8431"
        protocol: tcp
    networks:
      - homelable_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.00"
          memory: 64M
networks:
  homelable_network:

x-casaos:
  id: com.hiraappstore.homelable
  main: frontend
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.homelable/assets/icon.png
  title:
    en_US: Homelable
  index: /
  port_map: "8431"
  scheme: http
