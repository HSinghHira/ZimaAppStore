name: cloudreve

services:
  cloudreve:

    image: cloudreve/cloudreve:latest@sha256:baf6c86e4f5c0e9841c7d88960159066e9c38381c48d7f3a7a6cc762fab5fe5d
    container_name: cloudreve
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CR_CONF_Database.Type=postgres
      - CR_CONF_Database.Host=postgres
      - CR_CONF_Database.Port=5432
      - CR_CONF_Database.User=cloudreve

      - CR_CONF_Database.Password=CHANGEME_DB_PASSWORD
      - CR_CONF_Database.Name=cloudreve
      - CR_CONF_Redis.Server=redis:6379
    ports:
      - target: 5212
        published: "8409"
        protocol: tcp

      - target: 6888
        published: "8410"
        protocol: tcp
      - target: 6888
        published: "8410"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /cloudreve/data
        bind:
          create_host_path: true
    networks:
      - cloudreve_network
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
  postgres:

    image: postgres:17@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
    container_name: cloudreve-postgres
    restart: unless-stopped

    stop_grace_period: 60s
    environment:
      - POSTGRES_USER=cloudreve
      - POSTGRES_DB=cloudreve

      - POSTGRES_PASSWORD=CHANGEME_DB_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudreve -d cloudreve"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    networks:
      - cloudreve_network
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
  redis:
    image: redis:7-alpine@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
    container_name: cloudreve-redis
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/redis
        target: /data
        bind:
          create_host_path: true
    networks:
      - cloudreve_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.00"
          memory: 64M
networks:
  cloudreve_network:
    driver: bridge

x-casaos:
  id: com.hiraappstore.cloudreve
  main: cloudreve
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.cloudreve/assets/icon.png
  title:
    en_US: Cloudreve
  index: /
  port_map: "8409"
  scheme: http
  version: "4.16.0"
