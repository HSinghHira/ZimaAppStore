name: gamevault

services:
  gamevault-backend:
    image: phalcode/gamevault-backend:16.3.0@sha256:a64e0abd48a6f778a56a5ebb7eaefcdbe8acb71923f6e1f6dc8f78563f0d5543
    container_name: gamevault-backend
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    environment:
      - DB_HOST=gamevault-db
      - DB_USERNAME=gamevault
      - DB_PASSWORD=CHANGEME_DB_PASSWORD
      - DB_DATABASE=gamevault
      - SAVEFILES_ENABLED=true
    ports:
      - target: 8080
        published: "8433"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/files
        target: /files
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/media
        target: /media
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/$AppID/savefiles
        target: /savefiles
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.00"
          memory: 256M
  gamevault-db:
    image: postgres:17@sha256:e2fddda1fea39c634dccdae58dba5448eb3efb85aaa4054cf45cbed28f35d296
    container_name: gamevault-db
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: bridge
    environment:
      - POSTGRES_USER=gamevault
      - POSTGRES_PASSWORD=CHANGEME_DB_PASSWORD
      - POSTGRES_DB=gamevault
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/database
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.00"
          memory: 128M
x-casaos:
  id: com.hiraappstore.gamevault
  main: gamevault-backend
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.gamevault/assets/icon.png
  title:
    en_US: GameVault
  index: /
  port_map: "8433"
  scheme: http
  version: "16.3.0"
