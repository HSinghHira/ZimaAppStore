name: continuwuity

services:
  continuwuity:

    image: forgejo.ellis.link/continuwuation/continuwuity:latest@sha256:206162b4149c5fff4829ff02cbbf0ca63db1f820c5c59c00d8a89f9e9ed5c40f
    container_name: continuwuity
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: bridge
    command: /sbin/conduwuit
    environment:

      - CONTINUWUITY_SERVER_NAME=CHANGEME_matrix.example.com
      - CONTINUWUITY_DATABASE_PATH=/var/lib/continuwuity
      - CONTINUWUITY_ADDRESS=0.0.0.0
      - CONTINUWUITY_PORT=8008

      - CONTINUWUITY_WELL_KNOWN={client=https://CHANGEME_matrix.example.com,server=CHANGEME_matrix.example.com:443}
    ports:
      - target: 8008
        published: "8414"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /var/lib/continuwuity
        bind:
          create_host_path: true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
x-casaos:
  id: com.hiraappstore.continuwuity
  main: continuwuity
  icon: https://Zimaos.hsinghhira.me/apps/com.hiraappstore.continuwuity/assets/icon.png
  title:
    en_US: Continuwuity (Matrix)
  index: /
  port_map: "8414"
  scheme: http
  version: "26.7.2"
